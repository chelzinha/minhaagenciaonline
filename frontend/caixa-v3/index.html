<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Caixa V3 - Homologação</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #17324d; }
    main { width: min(92vw, 480px); padding: 28px; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(23,50,77,.12); text-align: center; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; color: #61758a; line-height: 1.5; }
    .error { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: #fff1f1; color: #9d2525; display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Caixa V3 - Homologação</h1>
    <p>Preparando o ambiente isolado de testes...</p>
    <div id="error" class="error"></div>
  </main>
  <script>
    (() => {
      const API_KEY = 'caixa_avista_v3_api_url';
      const V3_API = 'https://script.google.com/macros/s/AKfycbxRaTJeaXhGTC0Lbyqf_Osnr_HsOyUnlOWjwtGMvkvPY1d98H0RthjJPCkLJRkP1x8o/exec';

      try {
        localStorage.setItem(API_KEY, V3_API);
        sessionStorage.setItem('caixa_avista_v3_homologacao', '1');
        location.replace('/caixa-avista/?v3=homologacao');
      } catch (error) {
        const node = document.getElementById('error');
        node.style.display = 'block';
        node.textContent = 'Não foi possível preparar a homologação neste navegador. Libere o armazenamento local e tente novamente.';
      }
    })();
  </script>
</body>
</html>
