<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Simulador de Frete | AGF José Bonifácio</title>
  <meta name="description" content="Simule o frete saindo de Fortaleza e compare o balcão com Platinum, Clube Correios, Mini Envios e Correios App." />
  <meta name="theme-color" content="#FFFFFF" />
  <meta property="og:title" content="Simulador de Frete | AGF José Bonifácio" />
  <meta property="og:description" content="Compare o balcão com Platinum, Clube Correios, Mini Envios e Correios App, saindo de Fortaleza." />
  <meta property="og:image" content="/assets/og-whatsapp-correios-v2.png" />
  <link rel="icon" href="/assets/pwa/root/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/pwa/root/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/simulador/simulador.css?v=1.5.0" />
</head>
<body>
  <header class="sm-top">
    <div class="sm-top-in">
      <a class="sm-marca" href="/" aria-label="AGF José Bonifácio, página inicial">
        <img class="sm-marca-ic" src="/assets/correios-logo-2.png" alt="" width="42" height="42" />
        <span class="sm-marca-txt"><strong>AGF José Bonifácio</strong><small>Minha Agência Online</small></span>
      </a>
      <h1 class="sm-h1">Simule seu envio</h1>
    </div>
  </header>

  <main class="sm-app">
    <!-- Passos 1 a 3 -->
    <div class="sm-passos">
      <section class="sm-passo" aria-labelledby="p1">
        <h2 id="p1"><span class="sm-n">1</span>Como é o seu envio hoje?</h2>
        <div class="sm-perfis" id="perfil"></div>
      </section>
      <section class="sm-passo" aria-labelledby="p2">
        <div class="sm-passo-h">
          <h2 id="p2"><span class="sm-n">2</span>Embalagem</h2>
          <button type="button" class="sm-digitar" id="digitarMed" aria-pressed="false" aria-controls="medidas"></button>
        </div>
        <div class="sm-caixas" id="caixas"></div>
        <div class="sm-livre" id="medidas" hidden>
          <span class="sm-livre-cx" id="medPrevia" aria-hidden="true"></span>
          <label class="sm-campo"><span>Comprimento</span><span class="sm-campo-in"><input id="medC" inputmode="decimal" maxlength="5" autocomplete="off" /><i>cm</i></span></label>
          <span class="sm-x" aria-hidden="true">x</span>
          <label class="sm-campo"><span>Largura</span><span class="sm-campo-in"><input id="medL" inputmode="decimal" maxlength="5" autocomplete="off" /><i>cm</i></span></label>
          <span class="sm-x" aria-hidden="true">x</span>
          <label class="sm-campo"><span>Altura</span><span class="sm-campo-in"><input id="medA" inputmode="decimal" maxlength="5" autocomplete="off" /><i>cm</i></span></label>
        </div>
        <p class="sm-livre-msg" id="medMsg" role="status" aria-live="polite" hidden></p>
      </section>
      <section class="sm-passo" aria-labelledby="p3">
        <div class="sm-passo-h">
          <h2 id="p3"><span class="sm-n">3</span>Peso com a embalagem</h2>
          <button type="button" class="sm-digitar" id="digitarPeso" aria-pressed="false" aria-controls="pesoLivre"></button>
        </div>
        <div class="sm-pesos" id="pesos"></div>
        <div class="sm-livre sm-livre-peso" id="pesoLivre" hidden>
          <label class="sm-campo sm-campo-peso"><span class="sm-sr">Peso com a embalagem</span><span class="sm-campo-in"><input id="pesoV" inputmode="decimal" maxlength="7" autocomplete="off" /><i id="pesoUnTxt">kg</i></span></label>
          <div class="sm-seg" id="pesoUn" role="group" aria-label="Unidade do peso">
            <button type="button" data-v="g" aria-pressed="false">gramas</button>
            <button type="button" data-v="kg" aria-pressed="true">quilos</button>
          </div>
        </div>
        <p class="sm-livre-msg" id="pesoMsg" role="status" aria-live="polite" hidden></p>
      </section>
    </div>

    <!-- Passo 4: destino -->
    <section class="sm-destino" aria-labelledby="p4">
      <div class="sm-destino-h">
        <h2 id="p4"><span class="sm-n">4</span>Para onde vai?</h2>
        <p class="sm-dica">Digite o CEP ou clique no estado, no mapa.</p>
      </div>
      <div class="sm-cep-linha">
        <form class="sm-cep" id="cepForm" novalidate>
          <label for="cep" class="sm-sr">CEP de destino</label>
          <span class="sm-cep-campo">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
            <input id="cep" inputmode="numeric" maxlength="9" placeholder="CEP de destino" autocomplete="postal-code" />
          </span>
          <button type="submit" class="sm-btn" id="cepBtn">Buscar</button>
        </form>
        <div class="sm-seg" id="mapModo" role="group" aria-label="Pintar o mapa por">
          <button type="button" data-v="cap" aria-pressed="true">Capital</button>
          <button type="button" data-v="int" aria-pressed="false">Interior</button>
        </div>
      </div>
      <p class="sm-cep-msg" id="cepMsg" role="status" aria-live="polite" hidden></p>
      <div class="sm-destino-corpo">
        <div class="sm-mapa-box">
          <div class="sm-mapa" id="mapa" role="group" aria-label="Mapa do Brasil por estado"></div>
          <div class="sm-legenda" aria-hidden="true"><span>menor</span><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i><i class="h5"></i><span>maior</span></div>
        </div>
        <div class="sm-tipos" id="tipos"></div>
      </div>
    </section>

    <!-- Resultado -->
    <section class="sm-res" id="resultado" aria-labelledby="tRes">
      <h2 id="tRes" class="sm-sr">Resultado</h2>
      <div class="sm-res-topo">
        <div class="sm-rota" id="rota">
          <span class="sm-no sm-no-origem" aria-hidden="true"></span>
          <span class="sm-rota-txt"><b>Fortaleza</b><small>CE</small></span>
          <span class="sm-linha" aria-hidden="true"></span>
          <span class="sm-no sm-no-destino" aria-hidden="true"></span>
          <span class="sm-rota-txt sm-rota-dest"><b id="destNome">-</b><small id="destUf">-</small></span>
        </div>
        <div class="sm-seg" id="servico" role="group" aria-label="Serviço">
          <button type="button" data-v="SEDEX" aria-pressed="true">SEDEX</button>
          <button type="button" data-v="PAC" aria-pressed="false">PAC</button>
          <button type="button" data-v="MINI" aria-pressed="false">Mini Envios</button>
        </div>
      </div>
      <div class="sm-res-linha">
        <p class="sm-meta" id="meta"></p>
        <div class="sm-regra">
          <span class="sm-regra-t">Correios App</span>
          <div class="sm-seg" id="regra" role="group" aria-label="Cálculo do Correios App">
            <button type="button" data-v="PESO" aria-pressed="true">Por peso</button>
            <button type="button" data-v="VOLUME" aria-pressed="false">Por volume</button>
          </div>
        </div>
      </div>
      <div class="sm-cards" id="opcoes" aria-live="polite"></div>
      <div class="sm-res-pe">
        <div class="sm-economia" id="economia" hidden></div>
        <a class="sm-cta" id="cta" href="/simulador/opcoes/">
          Conheça cada opção
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
      </div>
    </section>
  </main>

  <button type="button" class="sm-barra" id="barra" hidden></button>

  <script src="/simulador/simulador.js?v=1.5.0" defer></script>
</body>
</html>
