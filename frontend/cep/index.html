<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta CEP | AGF José Bonifácio</title>
  <meta name="description" content="Busca de CEP e endereços da AGF José Bonifácio" />
  <meta name="theme-color" content="#00416B" />

  <meta property="og:title" content="Consulta CEP | AGF José Bonifácio" />
  <meta property="og:description" content="Busca de CEP e Endereços" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://minhaagenciaonline.com.br/cep/" />
  <meta property="og:image" content="https://minhaagenciaonline.com.br/assets/og-whatsapp-correios-v2.png" />

  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/address/address-widget.css" />
  <link rel="stylesheet" href="/cep/cep-page.css" />
<link rel="stylesheet" href="/shared/ui/agf-ui.css"/>
<link rel="stylesheet" href="/shared/ui/agf-header.css?v=1"/>
<script src="/shared/auth/agf-auth-config.js"></script>
<script src="/shared/auth/agf-auth-client.js"></script>
<link rel="manifest" href="/cep/manifest.webmanifest"/>
<link rel="icon" href="/assets/pwa/cep/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/pwa/cep/favicon-32.png"/>
<link rel="apple-touch-icon" href="/assets/pwa/cep/apple-touch-icon.png"/>
</head>
<body>
  <div class="cep-page">
    <!-- Cabecalho padrao da plataforma. Substitui o header proprio do /cep.
         O markup antigo foi removido; o CSS orfao em cep-page.css
         (.cep-header, .cep-header-inner, .cep-brand, .logo-circle,
         .cep-header-actions, .cep-header-link) sera limpo em etapa separada. -->
    <div data-agf-header data-route="/cep"></div>

    <main class="cep-main">
      <div class="cep-container">
        <section class="cep-copy" aria-labelledby="cep-title">
          <div class="cep-pill">
            <span class="material-symbols-rounded" aria-hidden="true">bolt</span>
            Consulta rápida
          </div>

          <h1 class="cep-title" id="cep-title">Busca de CEP e Endereços</h1>

          <div class="cep-widget-wrap agf-address-widget">
            <form class="agf-address-search-card" id="cep-form" autocomplete="off">
              <div class="agf-address-search-row">
                <label class="agf-address-field" for="cep-query">
                  <span class="material-symbols-rounded" aria-hidden="true">search</span>
                  <input
                    class="agf-address-input"
                    id="cep-query"
                    name="q"
                    type="search"
                    inputmode="search"
                    placeholder="Digite CEP ou endereço"
                    aria-label="Digite CEP ou endereço"
                  />
                </label>

                <button class="agf-address-button" id="cep-submit" type="submit">
                  <span class="material-symbols-rounded" aria-hidden="true">search</span>
                  Consultar
                </button>
              </div>

              <div class="agf-address-status" id="cep-status" role="status" aria-live="polite"></div>
              <div class="agf-address-results" id="cep-results"></div>
            </form>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/shared/address/address-config.js"></script>
  <script src="/shared/address/address-client.js"></script>
  <script src="/cep/cep-page.js"></script>
<script src="/shared/ui/agf-ui.js"></script>
<script src="/shared/ui/agf-header.js?v=1"></script>
<script>
  /* Cabecalho padrao: /cep e rota publica, entao o slot do usuario
     mostra Entrar. As duas acoes replicam os links do header antigo. */
  AgfHeader.mount({
    route: '/cep',
    user: null,
    actions: [
      { id:'postagens', label:'Postagens', icon:'parcel',
        onClick: function(){ window.open('/app/', '_blank', 'noopener,noreferrer'); } },
      { id:'inicio', label:'Início', icon:'globe', href:'/' }
    ],
    onLogin: function(){ window.location.href = '/agf/'; }
  });
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/cep/sw.js').catch(()=>{}));}</script>
</body>
</html>
