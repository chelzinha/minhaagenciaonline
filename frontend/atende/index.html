<!DOCTYPE html>
<html lang="pt-BR" class="agf-auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B3358">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <title>Atendimento — AGF José Bonifácio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="manifest" href="/atende/manifest.webmanifest">
  <link rel="stylesheet" href="/shared/ui/agf-ui.css">
  <script src="/shared/auth/agf-auth-config.js"></script>
  <script src="/shared/auth/agf-auth-client.js"></script>
  <script>window.AGF_ACCESS={roles:["admin","manager","user"],app:"atende"};</script>
  <script src="/shared/auth/agf-route-guard.js"></script>
  <style>
    :root{--agf-top:#1B3358;--agf-top2:#15304f;--agf-line:rgba(255,255,255,.14);--agf-accent:#16a6c9;--agf-bg:#f4f7fa;--agf-text:#102f55;--agf-muted:#64748b}
    *{box-sizing:border-box}
    html,body{height:100%;width:100%;max-width:100vw;margin:0;overflow:hidden!important}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--agf-bg);color:var(--agf-text)}
    button{font:inherit}
    .atende-shell{height:100vh;width:100%;max-width:100vw;min-width:0;overflow:hidden;display:grid;grid-template-rows:58px minmax(0,1fr)}
    .atende-topbar{min-width:0;max-width:100vw;overflow:hidden;background:linear-gradient(90deg,var(--agf-top),#163b5f);color:#fff;box-shadow:0 1px 0 rgba(15,23,42,.08);position:relative;z-index:30}
    .atende-topbar-inner{width:100%;min-width:0;max-width:100%;height:58px;display:flex;align-items:center;padding:0 22px;gap:12px;overflow:hidden}
    .portal-btn{width:36px;height:36px;border:0;background:transparent;color:#9ab1c9;border-radius:8px;display:grid;place-items:center;text-decoration:none;cursor:pointer;transition:.15s;flex:0 0 auto}
    .portal-btn:hover{background:rgba(255,255,255,.08);color:#fff}.portal-btn .material-symbols-rounded{font-size:22px}
    .top-divider{width:1px;height:32px;background:var(--agf-line);margin-right:3px;flex:0 0 auto}
    .atende-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}.brand-icon{width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.10);display:grid;place-items:center;color:#fff;flex:0 0 auto}.brand-icon .material-symbols-rounded{font-size:21px}.atende-brand strong{display:block;font-size:15px;line-height:1.1;font-weight:800;white-space:nowrap}.atende-brand small{display:block;margin-top:3px;font-size:10px;line-height:1;font-weight:700;color:#a7c5e4;letter-spacing:.02em;white-space:nowrap}
    .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;flex:0 0 auto}.icon-btn{width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:#9ab1c9;display:grid;place-items:center;cursor:pointer;transition:.15s;flex:0 0 auto}.icon-btn:hover{background:rgba(255,255,255,.08);color:#fff}.icon-btn .material-symbols-rounded{font-size:21px}
    .admin-top-btn{height:34px;border:1px solid rgba(255,255,255,.24);border-radius:9px;background:rgba(255,255,255,.10);color:#fff;padding:0 10px;display:none;align-items:center;gap:6px;font-size:11px;font-weight:800;cursor:pointer}.admin-top-btn:hover{background:rgba(255,255,255,.17)}.admin-top-btn .material-symbols-rounded{font-size:18px}
    .user-wrap{position:relative;flex:0 0 auto}.user-av{border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#0e9fbd;color:#fff;font-weight:800;border:2px solid rgba(255,255,255,.42);box-shadow:0 0 0 1px rgba(0,0,0,.08)}.user-av-md{width:34px;height:34px;font-size:13px;cursor:pointer;padding:0}.user-av-lg{width:45px;height:45px;font-size:16px;flex:0 0 auto}.user-av img{width:100%;height:100%;object-fit:cover;display:block}
    .user-menu{position:absolute;right:0;top:45px;width:236px;background:#fff;color:#122f52;border-radius:16px;box-shadow:0 18px 45px rgba(15,23,42,.20);border:1px solid rgba(15,23,42,.08);overflow:hidden;z-index:80}.user-menu-hd{display:flex;align-items:center;gap:11px;padding:16px}.user-menu-name{font-weight:800;font-size:14px;max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-menu-role{font-size:11px;color:#51667d;margin-top:2px}.user-menu-action{width:100%;height:46px;border:0;border-top:1px solid #e8edf3;background:#fff;color:#183e69;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;text-align:left}.user-menu-action:hover{background:#f6f9fc}.user-menu-action .material-symbols-rounded{font-size:19px;color:#09a4bd}.user-menu-action.danger{color:#d02a2a}.user-menu-action.danger .material-symbols-rounded{color:#d02a2a}
    .atende-frame-wrap{min-width:0;min-height:0;width:100%;max-width:100vw;overflow:hidden!important;position:relative;background:var(--agf-bg)}#atendeFrame{width:100%!important;max-width:100%!important;min-width:0!important;height:100%;border:0;display:block;background:#fff;overflow:hidden}
    .pwd-overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.pwd-overlay.on{display:flex}.pwd-card{width:min(420px,96vw);background:#fff;border-radius:16px;box-shadow:0 22px 55px rgba(15,23,42,.24);overflow:hidden}.pwd-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid #e5ebf1}.pwd-head strong{font-size:15px}.pwd-head button{margin-left:auto;border:0;background:transparent;cursor:pointer;color:#64748b}.pwd-body{padding:16px 18px}.pwd-field{margin-bottom:12px}.pwd-field label{display:block;font-size:11px;font-weight:800;color:#35516f;margin-bottom:5px}.pwd-field input{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:9px;padding:0 10px;font:inherit;outline:none}.pwd-field input:focus{border-color:#1c789d;box-shadow:0 0 0 3px rgba(28,120,157,.10)}.pwd-error{display:none;background:#fff1f2;color:#b42318;border-radius:8px;padding:8px 10px;font-size:11px;margin-bottom:10px}.pwd-error.show{display:block}.pwd-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}.pwd-actions button{height:34px;border-radius:8px;padding:0 13px;border:1px solid #cbd5e1;background:#fff;color:#183e69;font-weight:800;cursor:pointer}.pwd-actions .primary{background:#173c64;color:#fff;border-color:#173c64}
    .toast{position:fixed;right:18px;bottom:18px;z-index:120;background:#173c64;color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:700;box-shadow:0 12px 30px rgba(15,23,42,.2);display:none}.toast.on{display:block}.toast.err{background:#b42318}
    @media(max-width:640px){.atende-topbar-inner{padding:0 10px}.top-divider{display:none}.atende-brand small{display:none}.atende-brand strong{font-size:13px}.brand-icon{width:34px;height:34px}.portal-btn{width:32px}.top-actions{gap:3px}.admin-top-btn span:last-child{display:none}.admin-top-btn{width:34px;padding:0;justify-content:center}}
  </style>
</head>
<body>
  <div class="atende-shell">
    <header class="atende-topbar">
      <div class="atende-topbar-inner">
        <a class="portal-btn" href="/agf/" title="Voltar ao Portal AGF" aria-label="Voltar ao Portal AGF"><span class="material-symbols-rounded">apps</span></a>
        <span class="top-divider" aria-hidden="true"></span>
        <a class="atende-brand" href="/agf/" aria-label="Voltar ao Portal AGF"><span class="brand-icon"><span class="material-symbols-rounded">support_agent</span></span><span><strong>Atendimento</strong><small>AGF JOSÉ BONIFÁCIO</small></span></a>
        <div class="top-actions">
          <button class="admin-top-btn" id="adminTopBtn" type="button" title="Cadastros do Atende"><span class="material-symbols-rounded">admin_panel_settings</span><span>Admin</span></button>
          <button class="icon-btn" id="refreshFrameBtn" type="button" title="Atualizar" aria-label="Atualizar"><span class="material-symbols-rounded">refresh</span></button>
          <div class="user-wrap">
            <button class="user-av user-av-md" id="userAvBtn" type="button" aria-label="Conta">·</button>
            <div class="user-menu" id="userMenu" style="display:none">
              <div class="user-menu-hd"><div class="user-av user-av-lg" id="userAvLg">·</div><div><div class="user-menu-name" id="userMenuName">Usuário</div><div class="user-menu-role" id="userMenuRole"></div></div></div>
              <button class="user-menu-action" id="userAvatarBtn" type="button"><span class="material-symbols-rounded">add_a_photo</span>Alterar foto</button>
              <button class="user-menu-action" id="userPasswordBtn" type="button"><span class="material-symbols-rounded">password</span>Alterar senha</button>
              <input type="file" id="userAvatarInput" accept="image/png,image/jpeg,image/webp" hidden>
              <button class="user-menu-action danger" id="userLogout" type="button"><span class="material-symbols-rounded">logout</span>Sair</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="atende-frame-wrap">
      <iframe id="atendeFrame" src="https://script.google.com/macros/s/AKfycbwCBAG4gBVHMHh7cHgnIG215RL8m8CbymvsAaHcs4bXhp0RCyPeP_cr6IA5iZtsch_m1g/exec" data-agf-frame-src="https://script.google.com/macros/s/AKfycbwCBAG4gBVHMHh7cHgnIG215RL8m8CbymvsAaHcs4bXhp0RCyPeP_cr6IA5iZtsch_m1g/exec" title="Atendimento" loading="eager" scrolling="no" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>
  </div>

  <div class="pwd-overlay" id="pwdOverlay" aria-hidden="true"><form class="pwd-card" id="pwdForm"><div class="pwd-head"><strong>Alterar senha</strong><button type="button" id="pwdClose" aria-label="Fechar"><span class="material-symbols-rounded">close</span></button></div><div class="pwd-body"><div class="pwd-error" id="pwdError"></div><div class="pwd-field"><label>Senha atual</label><input id="pwdCurrent" type="password" autocomplete="current-password" required></div><div class="pwd-field"><label>Nova senha</label><input id="pwdNew" type="password" autocomplete="new-password" minlength="6" required></div><div class="pwd-field"><label>Confirmar nova senha</label><input id="pwdConfirm" type="password" autocomplete="new-password" minlength="6" required></div><div class="pwd-actions"><button type="button" id="pwdCancel">Cancelar</button><button class="primary" id="pwdSave" type="submit">Salvar</button></div></div></form></div>
  <div class="toast" id="toast"></div>

  <script src="/shared/ui/agf-ui.js"></script>
  <script>
    (function(){
      'use strict';
      const frame=document.getElementById('atendeFrame');
      const userMenu=document.getElementById('userMenu');
      const AV_KEY='agf_jb_avatar_v1';
      let authSendSeq=0;
      let atendeMessageTarget=null;

      function el(id){return document.getElementById(id)}
      function localSession(){try{return window.AgfAuth&&window.AgfAuth.getLocalSession?window.AgfAuth.getLocalSession():null}catch(_){return null}}
      function currentUser(){const s=localSession();return (s&&s.user)||(window.AgfAuth&&window.AgfAuth.getCachedUser?window.AgfAuth.getCachedUser():null)||null}
      function token(){const s=localSession();return s&&s.token?s.token:''}
      function roleLabel(role){role=String(role||'').toLowerCase();if(role==='admin')return'Administrador';if(role==='manager')return'Gestor';return'Usuário'}
      function initial(name){name=String(name||'').trim();return name?name.charAt(0).toUpperCase():'·'}
      function displayName(u){return String((u&&(u.displayName||u.name||u.username||u.email))||'Usuário')}
      function usernameFromSession(s){const u=(s&&s.user)||{};const p=(s&&s.payload)||{};return String(u.username||u.email||u.name||p.sub||'')}
      function roleFromSession(s){const u=(s&&s.user)||{};const p=(s&&s.payload)||{};return String(u.role||p.role||'').toLowerCase()}
      function isAdminSession(s){return roleFromSession(s)==='admin'}
      function showToast(msg,isErr){const n=el('toast');if(!n)return;n.textContent=msg;n.className='toast on'+(isErr?' err':'');clearTimeout(showToast.t);showToast.t=setTimeout(()=>{n.className='toast'},2600)}

      async function authPost(action,payload){const cfg=window.AGF_AUTH_CONFIG||{};if(!cfg.apiUrl)throw new Error('Backend de autenticação não configurado.');const response=await fetch(cfg.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},payload||{})),redirect:'follow'});const data=await response.json();if(!data||data.ok===false)throw new Error((data&&data.error)||'Não foi possível concluir a operação.');return data}
      function paintAvatar(data){['userAvBtn','userAvLg'].forEach(id=>{const n=el(id);if(!n)return;if(data){n.innerHTML='<img alt="" src="'+String(data).replace(/"/g,'&quot;')+'">'}else{n.textContent=initial(displayName(currentUser()))}})}
      function cachedAvatar(u){try{const raw=localStorage.getItem(AV_KEY);if(!raw)return'';const o=JSON.parse(raw);return o&&u&&o.u===u.username?(o.d||''):''}catch(_){return''}}
      function cacheAvatar(u,d){try{localStorage.setItem(AV_KEY,JSON.stringify({u:u&&u.username,d:d||''}))}catch(_){}}
      function renderAccount(){const s=localSession();const u=currentUser()||{};const name=displayName(u);const role=roleFromSession(s)||String(u.role||'');el('userMenuName').textContent=name;el('userMenuRole').textContent=roleLabel(role);el('adminTopBtn').style.display=String(role).toLowerCase()==='admin'?'inline-flex':'none';paintAvatar(cachedAvatar(u))}
      async function refreshAvatar(){const u=currentUser(),tk=token();if(!u||!tk)return;try{const d=await authPost('getMyAvatar',{token:tk});const data=(d&&d.avatar)||'';cacheAvatar(u,data);paintAvatar(data)}catch(_){}}

      function authPayload(type){const session=localSession();if(!session||!session.token)return null;return{type:type,token:session.token,user:{username:usernameFromSession(session),role:roleFromSession(session)}}}
      function postToAtende(payload,target){
        const dest=target||atendeMessageTarget;
        if(dest){try{dest.postMessage(payload,'*');return true}catch(_){} }
        if(frame&&frame.contentWindow){try{frame.contentWindow.postMessage(payload,'*');return true}catch(_){} }
        return false;
      }
      async function sendAuth(validateFirst,target){
        const seq=++authSendSeq;
        try{if(validateFirst&&window.AgfAuth&&window.AgfAuth.validate){await window.AgfAuth.validate({timeoutMs:10000})}}catch(_){}
        if(seq!==authSendSeq)return;
        const payload=authPayload('agf:auth-context');if(!payload)return;
        renderAccount();postToAtende(payload,target);
      }
      async function openAtendeAdmin(){
        const session=localSession();
        if(!isAdminSession(session)){showToast('Sua sessão não possui perfil de administrador.',true);return}
        if(!atendeMessageTarget){
          showToast('Conectando à área administrativa...');
          await sendAuth(true);
          await new Promise(resolve=>setTimeout(resolve,350));
        }
        const payload=authPayload('agf:open-admin');
        if(!payload){showToast('Sessão administrativa indisponível.',true);return}
        if(!postToAtende(payload)){
          showToast('Não foi possível conectar ao painel. Atualize a página e tente novamente.',true);
          return;
        }
        setTimeout(()=>postToAtende(payload),180);
      }

      frame.addEventListener('load',function(){atendeMessageTarget=null;setTimeout(()=>sendAuth(true),180);setTimeout(()=>sendAuth(false),900);setTimeout(()=>sendAuth(false),1800)});
      window.addEventListener('message',function(e){
        const d=e.data||{};
        if(d.type==='agf:auth-request'){
          atendeMessageTarget=e.source||atendeMessageTarget;
          sendAuth(true,atendeMessageTarget);
        }
        if(d.type==='agf:admin-state'){
          atendeMessageTarget=e.source||atendeMessageTarget;
          if(d.isAdmin)el('adminTopBtn').style.display='inline-flex';
        }
      });
      window.addEventListener('focus',()=>sendAuth(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)sendAuth(false)});

      el('adminTopBtn').addEventListener('click',openAtendeAdmin);
      el('refreshFrameBtn').addEventListener('click',function(){atendeMessageTarget=null;frame.src=frame.getAttribute('data-agf-frame-src')||frame.src});
      el('userAvBtn').addEventListener('click',function(e){e.stopPropagation();userMenu.style.display=userMenu.style.display==='none'?'block':'none'});
      document.addEventListener('click',function(e){if(userMenu.style.display!=='none'&&!userMenu.contains(e.target)&&e.target!==el('userAvBtn'))userMenu.style.display='none'});
      el('userLogout').addEventListener('click',async function(){this.disabled=true;try{if(window.AgfAuth&&window.AgfAuth.logout)await window.AgfAuth.logout()}finally{location.href='/agf/?reason=logout'}});

      el('userAvatarBtn').addEventListener('click',function(){userMenu.style.display='none';el('userAvatarInput').click()});
      el('userAvatarInput').addEventListener('change',function(){const f=this.files&&this.files[0];this.value='';if(!f)return;if(!/^image\/(png|jpeg|webp)$/i.test(f.type)){showToast('Use uma imagem PNG, JPEG ou WebP.',true);return}const img=new Image();img.onload=function(){try{const size=128,canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');const scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);const data=canvas.toDataURL('image/jpeg',.86);const u=currentUser();showToast('Enviando foto...');authPost('uploadMyAvatar',{token:token(),avatarData:data}).then(function(){cacheAvatar(u,data);paintAvatar(data);showToast('Foto atualizada.')}).catch(err=>showToast(err.message||'Não foi possível atualizar a foto.',true))}finally{URL.revokeObjectURL(img.src)}};img.onerror=function(){URL.revokeObjectURL(img.src);showToast('Arquivo de imagem inválido.',true)};img.src=URL.createObjectURL(f)});

      function closePwd(){el('pwdOverlay').classList.remove('on');el('pwdOverlay').setAttribute('aria-hidden','true');el('pwdForm').reset();el('pwdError').className='pwd-error'}
      el('userPasswordBtn').addEventListener('click',function(){userMenu.style.display='none';el('pwdOverlay').classList.add('on');el('pwdOverlay').setAttribute('aria-hidden','false');setTimeout(()=>el('pwdCurrent').focus(),50)});el('pwdClose').addEventListener('click',closePwd);el('pwdCancel').addEventListener('click',closePwd);el('pwdOverlay').addEventListener('click',function(e){if(e.target===this)closePwd()});
      el('pwdForm').addEventListener('submit',async function(e){e.preventDefault();const cur=el('pwdCurrent').value,nv=el('pwdNew').value,cf=el('pwdConfirm').value,err=el('pwdError');err.className='pwd-error';if(nv!==cf){err.textContent='As novas senhas não coincidem.';err.className='pwd-error show';return}const save=el('pwdSave');save.disabled=true;try{await authPost('changeMyPassword',{token:token(),currentPassword:cur,newPassword:nv});closePwd();showToast('Senha alterada. Entre novamente.');if(window.AgfAuth&&window.AgfAuth.clearSession)window.AgfAuth.clearSession();setTimeout(()=>{location.href='/agf/?reason=password-changed'},900)}catch(ex){err.textContent=ex.message||'Não foi possível alterar a senha.';err.className='pwd-error show'}finally{save.disabled=false}});

      renderAccount();refreshAvatar();setTimeout(()=>sendAuth(true),350);setTimeout(()=>sendAuth(false),1200);
    })();
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/atende/sw.js').catch(()=>{}));}
  </script>
</body>
</html>
