<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00416B">
  <title>Atendimento — AGF José Bonifácio</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="manifest" href="/atende/manifest.webmanifest">
  <link rel="stylesheet" href="/shared/ui/agf-ui.css">
  <script src="/shared/auth/agf-auth-config.js"></script>
  <script src="/shared/auth/agf-auth-client.js"></script>
  <script>window.AGF_ACCESS={roles:["admin","manager","user"],app:"atende"};</script>
  <script src="/shared/auth/agf-route-guard.js"></script>
</head>
<body>
  <div class="agf-frame-layout agf-embed-only">
    <iframe
      id="atendeFrame"
      src="https://script.google.com/macros/s/AKfycbwCBAG4gBVHMHh7cHgnIG215RL8m8CbymvsAaHcs4bXhp0RCyPeP_cr6IA5iZtsch_m1g/exec"
      data-agf-frame-src="https://script.google.com/macros/s/AKfycbwCBAG4gBVHMHh7cHgnIG215RL8m8CbymvsAaHcs4bXhp0RCyPeP_cr6IA5iZtsch_m1g/exec"
      title="Atendimento"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  <script src="/shared/ui/agf-ui.js"></script>
  <script>
    (function(){
      const frame=document.getElementById('atendeFrame');
      function sendAuth(){
        try{
          const session=window.AgfAuth&&window.AgfAuth.getLocalSession?window.AgfAuth.getLocalSession():null;
          if(!session||!session.token||!frame||!frame.contentWindow)return;
          const cached=session.user||{};
          const payload=session.payload||{};
          frame.contentWindow.postMessage({
            type:'agf:auth-context',
            token:session.token,
            user:{
              username:String(cached.username||cached.email||cached.name||payload.sub||''),
              role:String(cached.role||payload.role||'')
            }
          },'*');
        }catch(e){}
      }
      frame.addEventListener('load',function(){setTimeout(sendAuth,250);setTimeout(sendAuth,1200)});
      window.addEventListener('message',function(e){
        const d=e.data||{};
        if(d.type==='agf:auth-request')sendAuth();
      });
      setTimeout(sendAuth,900);
    })();
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/atende/sw.js').catch(()=>{}));}
  </script>
</body>
</html>
