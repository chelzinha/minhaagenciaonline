<body>
  <div class="preview-note">PREVIEW COM DADOS SINTÉTICOS - nenhuma planilha é acessada</div>
  <main class="preview-main"><div id="curvaAbcRoot" class="abc-root"></div></main>
  <script src="/curva/curva-abc.js?v=4"></script>
  <script>
  (function(){
    const months=Array.from({length:12},(_,i)=>{const d=new Date(2025,8+i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return{key,label:String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(),partial:i===11};});
    const clients=Array.from({length:42},(_,i)=>{const monthly={},wave=[0,6,3,3,9,4,11,6,6,13,8,5];months.forEach((m,j)=>{const empty=(i+j)%7===0;monthly[m.key]={qtd:empty?0:20+i+wave[j],value:empty?0:9000-i*110+wave[j]*180};});return{clientId:'S'+i,client:'Cliente sintético '+String(i+1).padStart(2,'0'),fantasy:i%3===0?'Nome fantasia de demonstração':'',curve:i<12?'A':i<30?'B':'C',status:i>36?'NOVO':'CARTEIRA',signal:i%6===0?'QUEDA CRÍTICA':i%5===0?'CRESCIMENTO':'ESTÁVEL',priority:i%6===0?'ALTA':i%5===0?'OPORTUNIDADE':'BAIXA',score:50,months:monthly,totals:{qtd:1200+i,value:85000-i*700,ticket:8.4},intermediary:i%2?'Portal Postal':'',contract:i%4?'Contrato ativo':'',card:i%4?'Cartão cadastrado':'',cadastroStatus:i%8===0?'PENDENTE':'ATIVO',loginPpn:i%8===0?'NÃO':'SIM',cwsMessage:i%9===0?'Revisar acesso':'',recommendedAction:i%6===0?'Contato preventivo e revisão da operação':'Manter acompanhamento recorrente'};});
    const evolution=months.map((m,i)=>({key:m.key,label:m.label,partial:m.partial,qtd:43000+i*900,value:410000+i*18000,activeClients:38+i%4,newClients:i<6?0:i%4,reactivatedClients:i%3,valueChangePct:i?0.03:null}));
    const data={ok:true,period:{months,referenceMonth:'2026-08',previousMonth:'2026-07',partial:true},rules:{curveAUntil:.8,curveBUntil:.95,curveBRevenueFloor:5000,newFrom:'2026-03',months:12},summary:{clients:42,totalQtd:52900,totalValue:608000,newClients:3,reactivatedClients:1,curves:{A:12,B:18,C:12},priorities:{ALTA:7,OPORTUNIDADE:8,BAIXA:27}},evolution,filters:{curves:['A','B','C'],statuses:['CARTEIRA','NOVO'],signals:['ESTÁVEL','QUEDA CRÍTICA','CRESCIMENTO'],priorities:['ALTA','OPORTUNIDADE','BAIXA'],intermediaries:['Portal Postal'],cadastroStatuses:['ATIVO','PENDENTE']},clients};
    CurvaABC.init({apiGet:async()=>data,toast:message=>console.log(message)});
    CurvaABC.ensureLoaded();
  })();
  </script>
