<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f6ee8">
  <title>Restaurando Caixa Balcão</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f8fc;color:#17324d}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(100%,460px);background:#fff;border:1px solid #dbe7f3;border-radius:24px;padding:28px;box-sizing:border-box;box-shadow:0 18px 50px rgba(23,50,77,.12);text-align:center}
    .icon{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:#0f6ee8;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}
    h1{margin:0 0 8px;font-size:24px}p{margin:0;color:#65788c;line-height:1.45}#status{margin-top:18px;padding:12px 14px;border-radius:14px;background:#eef6ff;color:#175a9d;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="icon">↻</div>
    <h1>Restaurando o Caixa</h1>
    <p>Estamos removendo a versão em cache e carregando novamente a versão estável.</p>
    <div id="status">Limpando cache...</div>
  </main>
  <script>
    (async function () {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => {
            try {
              const scopePath = new URL(registration.scope).pathname;
              if (scopePath === '/caixa/' || scopePath.startsWith('/caixa/')) return registration.unregister();
            } catch (_) {}
            return Promise.resolve(false);
          }));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('agf-caixa-')).map(key => caches.delete(key)));
        }
        try {
          localStorage.removeItem('caixa_avista_v3_api_url');
          localStorage.removeItem('caixa_avista_v3_default_unit');
        } catch (_) {}
        status.textContent = 'Cache limpo. Abrindo o Caixa...';
        window.setTimeout(() => window.location.replace('/caixa/?recovery=' + Date.now()), 350);
      } catch (error) {
        status.textContent = 'Não foi possível limpar automaticamente. Feche esta aba e abra novamente o Caixa.';
        console.error('[CAIXA_RECOVERY]', error);
      }
    })();
  </script>
</body>
</html>
