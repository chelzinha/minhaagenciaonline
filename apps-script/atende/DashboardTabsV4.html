    kpi('Ticket médio',money(k.valorMedio),'sell','#F2B500',prev.disponivel?deltaBadge(k.valorMedio,prev.valorMedio,false):'')+

    kpi('Projeção do mês',proj?money(proj):'—','trending_up','#F97316',proj&&k.faturamento?deltaBadge(proj,k.faturamento,false)+' sobre realizado':'')+
    '</div><div class="v4-goals">'+goalSingle('Encomendas',n(m.realizado&&m.realizado.encomendas),n(c.encomendasMeta),c,'#C46A1A')+goalTier('Balcão AGF','balcao',m,'#7890A7')+goalTier('Metrô','metro',m,'#D8A400')+medalMap(m)+'</div><div class="v4-grid2">'+card('Evolução diária do faturamento','valor exato ao passar o mouse',lineChart(d.evolucao||[],'valor'))+card('Realizado x meta x projeção','por grupo',groupBars(m))+'</div></div>'}

  function renderManagement(){var d=DATA||{},k=d.kpis||{},g=d.gestao||{},r=d.remuneracao||{},prev=d.comparacao||{},rm=contractRem(r.mensageria,'mens'),re=contractRem(r.encomendas,'enc'),total=rm.total+re.total,dash=document.getElementById('dashboardView');dash.innerHTML='<div class="v4-shell"><div class="v4-title">Gestão <small>visão executiva e remuneração contratual</small></div><div class="v4-kpis">'+
    kpi('Receita total',money(k.faturamento),'payments','#00A79D',prev.disponivel?deltaBadge(k.faturamento,prev.faturamento,false):'')+
    kpi('Postagens',integer(k.postagens),'inventory_2','#0B72D9',prev.disponivel?deltaBadge(k.postagens,prev.postagens,false):'')+
    kpi('Ticket médio',money(k.valorMedio),'sell','#F2B500',prev.disponivel?deltaBadge(k.valorMedio,prev.valorMedio,false):'')+
    kpi('Dias com movimento',integer(g.diasAtivos),'calendar_month','#7C3AED',money(g.mediaDiariaFaturamento)+' / dia')+
    kpi('Mensageria elegível',money(r.mensageria&&r.mensageria.valor),'mail','#00A79D','R2 G1')+
    kpi('Encomendas elegíveis',money(r.encomendas&&r.encomendas.valor),'package_2','#F97316','R2 G2')+
    '</div><div class="v4-rem-grid">'+remCard('Mensageria - R2 G1',rm,'#00A79D')+remCard('Encomendas - R2 G2',re,'#F97316')+remTotal(rm,re,total)+'</div><div class="v4-grid2">'+card('Faturamento dos últimos 6 meses','valores mensais visíveis',monthBars(d.evolucao6Meses||[]))+opportunity(d.oportunidadeEmbalagem||{})+'</div><div class="v4-donuts">'+donut('Faturamento por Local',d.localGlobal||d.local||[])+donut('Mix por Tipo de Serviço',d.tipoServico||[])+donut('Canal',d.canais||d.intermediadores||[])+'</div></div>'}

  function lineChart(rows,key){if(!rows||!rows.length)return'<div class="v4-empty">Sem dados.</div>';var W=720,H=240,L=62,R=18,T=18,B=36,pw=W-L-R,ph=H-T-B,vals=rows.map(function(x){return n(x[key])}),max=Math.max.apply(null,vals.concat([1])),pts=rows.map(function(x,i){return{x:rows.length===1?L+pw/2:L+i*pw/(rows.length-1),y:T+ph-n(x[key])*ph/max,row:x}}),grid='',labels='',dots='';for(var i=0;i<=4;i++){var y=T+i*ph/4,v=max*(1-i/4);grid+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e7edf2"/><text x="'+(L-7)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="#718096">'+esc(key==='valor'?compactMoney(v):integer(v))+'</text>'}var step=Math.max(1,Math.ceil(rows.length/7));pts.forEach(function(p,j){if(j%step===0||j===pts.length-1)labels+='<text x="'+p.x+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="#718096">'+esc(period(p.row.label))+'</text>';dots+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#fff" stroke="#0B72D9" stroke-width="2"><title>'+esc(period(p.row.label)+' · '+(key==='valor'?money(p.row.valor):integer(p.row.quantidade)))+'</title></circle>'});var poly=pts.map(function(p){return p.x+','+p.y}).join(' ');return'<svg class="v4-svg" viewBox="0 0 '+W+' '+H+'">'+grid+'<polyline points="'+poly+'" fill="none" stroke="#0B72D9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dots+labels+'</svg>'}

  function monthBars(rows){if(!rows||!rows.length)return'<div class="v4-empty">Sem histórico.</div>';var W=650,H=235,L=54,R=10,T=30,B=36,pw=W-L-R,ph=H-T-B,max=Math.max.apply(null,rows.map(function(x){return n(x.valor)}).concat([1])),bw=Math.max(26,pw/rows.length*.55),gap=pw/rows.length,out='';for(var i=0;i<=4;i++){var y=T+i*ph/4,v=max*(1-i/4);out+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e7edf2"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="8" fill="#718096">'+esc(compactMoney(v))+'</text>'}rows.forEach(function(x,i){var val=n(x.valor),h=val*ph/max,cx=L+gap*i+gap/2,xx=cx-bw/2,yy=T+ph-h;out+='<rect x="'+xx+'" y="'+yy+'" width="'+bw+'" height="'+h+'" rx="6" fill="'+(i===rows.length-1?'#075AA6':'#3B92EA')+'"><title>'+esc(period(x.label)+' · '+money(val))+'</title></rect><text x="'+cx+'" y="'+Math.max(12,yy-6)+'" text-anchor="middle" font-size="8" font-weight="800" fill="#17385d">'+esc(compactMoney(val))+'</text><text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="#718096">'+esc(period(x.label))+'</text>'});return'<svg class="v4-svg" viewBox="0 0 '+W+' '+H+'">'+out+'</svg>'}

  function donut(title,rows){rows=(rows||[]).filter(function(x){return n(x.valor)>0}).slice(0,6);if(!rows.length)return card(title,'','<div class="v4-empty">Sem dados.</div>');var sum=rows.reduce(function(a,x){return a+n(x.valor)},0),start=0,parts=[],leg='';rows.forEach(function(x,i){var p=n(x.valor)*100/sum,end=start+p,c=COLORS[i%COLORS.length];parts.push(c+' '+start.toFixed(2)+'% '+end.toFixed(2)+'%');leg+='<div class="v4-legend-row"><span class="v4-dot" style="background:'+c+'"></span><b title="'+esc(x.label)+'">'+esc(x.label)+'</b><strong>'+pct(p,1)+'</strong></div>';start=end});return'<section class="v4-card"><div class="v4-head"><strong>'+esc(title)+'</strong></div><div class="v4-donut-body"><div class="v4-donut" style="background:conic-gradient('+parts.join(',')+')"><div class="v4-donut-center"><div><strong>'+compactMoney(sum)+'</strong><small>Total</small></div></div></div><div class="v4-legend">'+leg+'</div></div></section>'}
  function rank(title,rows,total,limit){rows=(rows||[]).slice(0,limit||7);var max=Math.max.apply(null,rows.map(function(x){return n(x.valor)}).concat([1]));return card(title,'por faturamento','<div class="v4-bars">'+rows.map(function(x){return'<div class="v4-bar-row"><span title="'+esc(x.label)+'">'+esc(x.label)+'</span><div class="v4-track"><div class="v4-fill" style="width:'+Math.max(1,n(x.valor)*100/max)+'%"></div></div><strong>'+compactMoney(x.valor)+' · '+pct(share(x.valor,total),1)+'</strong></div>'}).join('')+'</div>')}

  function projection(actual,c){var done=n(c&&c.diasUteisRealizados),days=n(c&&c.diasUteisMes);return done>0&&days>0?n(actual)/done*days:0}
  function expected(target,c){var done=n(c&&c.diasUteisRealizados),days=n(c&&c.diasUteisMes);return days>0?n(target)*done/days:0}
  function needed(target,actual,c){var rem=n(c&&c.diasUteisMes)-n(c&&c.diasUteisRealizados);return rem>0?Math.max(0,n(target)-n(actual))/rem:0}
  function goalSingle(title,actual,target,c,color){var p=target?actual*100/target:0,proj=projection(actual,c);return'<section class="v4-card v4-goal" style="--goal:'+color+'"><div class="v4-goal-title"><strong>'+esc(title)+'</strong><span class="v4-badge" style="--badge:'+color+';--badge-bg:#fff4eb">Meta única</span></div><div class="v4-goal-main"><div><div class="v4-goal-value">'+money(actual)+'</div><div class="v4-note">de '+(target?money(target):'meta não cadastrada')+'</div></div><div class="v4-goal-pct">'+(target?pct(p,1):'—')+'</div></div><div class="v4-progress"><span style="width:'+Math.min(100,p)+'%"></span></div><div class="v4-goal-meta"><div class="v4-mini"><span>Dias úteis</span><strong>'+integer(c.diasUteisRealizados)+' / '+integer(c.diasUteisMes)+'</strong></div><div class="v4-mini"><span>Esperado hoje</span><strong>'+money(expected(target,c))+'</strong></div><div class="v4-mini"><span>Projeção</span><strong>'+money(proj)+'</strong></div></div><div class="v4-next">Necessário por dia<b>'+money(needed(target,actual,c))+'</b></div></section>'}
  function tierData(prefix,c){return['Bronze','Prata','Ouro','Diamante'].map(function(name,i){var key=prefix+name.charAt(0).toUpperCase()+name.slice(1);return{name:name,value:n(c[key]),color:['#B87333','#9AA8B5','#D8A400','#3B82F6'][i]}})}
  function tierState(actual,tiers){var current=null,next=null;tiers.forEach(function(t){if(t.value>0&&actual>=t.value)current=t;else if(!next&&t.value>0&&actual<t.value)next=t});return{current:current,next:next}}
  function goalTier(title,prefix,m,color){var c=m.config||{},actual=n(m.realizado&&m.realizado[prefix]),tiers=tierData(prefix,c),st=tierState(actual,tiers),base=tiers[0].value||0,p=base?actual*100/base:0,proj=projection(actual,c),target=st.next?st.next.value:(tiers[3].value||base);return'<section class="v4-card v4-goal" style="--goal:'+color+'"><div class="v4-goal-title"><strong>'+esc(title)+'</strong><span class="v4-badge" style="--badge:'+(st.current?st.current.color:'#64748b')+';--badge-bg:#f5f7f9">'+esc(st.current?st.current.name:'Abaixo da Bronze')+'</span></div><div class="v4-goal-main"><div><div class="v4-goal-value">'+money(actual)+'</div><div class="v4-note">meta base '+(base?money(base):'não cadastrada')+'</div></div><div class="v4-goal-pct">'+(base?pct(p,1):'—')+'</div></div><div class="v4-progress"><span style="width:'+Math.min(100,p)+'%"></span></div><div class="v4-goal-meta"><div class="v4-mini"><span>Dias úteis</span><strong>'+integer(c.diasUteisRealizados)+' / '+integer(c.diasUteisMes)+'</strong></div><div class="v4-mini"><span>Esperado hoje</span><strong>'+money(expected(base,c))+'</strong></div><div class="v4-mini"><span>Projeção</span><strong>'+money(proj)+'</strong></div></div><div class="v4-next">'+(st.next?'Falta para '+st.next.name:'Faixa máxima atingida')+'<b>'+(st.next?money(Math.max(0,st.next.value-actual)):'🏆 Diamante')+'</b></div></section>'}
  function medalMap(m){var c=m.config||{},groups=[['Balcão AGF','balcao'],['Metrô','metro']],html='<section class="v4-card"><div class="v4-head"><strong>Mapa de medalhas</strong><span>faixas atuais</span></div><div class="v4-medals">';groups.forEach(function(g){var actual=n(m.realizado&&m.realizado[g[1]]),tiers=tierData(g[1],c),st=tierState(actual,tiers);html+='<div class="v4-medal-row"><div class="v4-medal-top"><span>'+g[0]+'</span><span>'+(st.current?st.current.name:'Sem medalha')+'</span></div><div class="v4-medal-strip">'+tiers.map(function(t){return'<div class="v4-medal '+(t.value&&actual>=t.value?'hit':'')+'" style="color:'+t.color+'">★<br>'+t.name+'</div>'}).join('')+'</div></div>'});return html+'</div><div class="v4-note" style="margin-top:7px">Encomendas permanece com meta única até que faixas próprias sejam cadastradas.</div></section>'}
  function groupBars(m){var c=m.config||{},items=[{label:'Encomendas',actual:n(m.realizado&&m.realizado.encomendas),target:n(c.encomendasMeta)},{label:'Balcão AGF',actual:n(m.realizado&&m.realizado.balcao),target:n(c.balcaoBronze)},{label:'Metrô',actual:n(m.realizado&&m.realizado.metro),target:n(c.metroBronze)}],max=Math.max.apply(null,items.reduce(function(a,x){return a.concat([x.actual,x.target,projection(x.actual,c)])},[1])),W=620,H=220,L=45,R=10,T=18,B=38,pw=W-L-R,ph=H-T-B,gap=pw/items.length,bw=gap/5,out='';items.forEach(function(x,i){var vals=[[x.actual,'#0B72D9','Real'],[x.target,'#8DBCEB','Meta'],[projection(x.actual,c),'#F2B500','Proj.']],cx=L+gap*i+gap/2;vals.forEach(function(v,j){var h=n(v[0])*ph/max,xx=cx+(j-1)*bw*1.25-bw/2,yy=T+ph-h;out+='<rect x="'+xx+'" y="'+yy+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+v[1]+'"><title>'+esc(x.label+' · '+v[2]+' · '+money(v[0]))+'</title></rect><text x="'+(xx+bw/2)+'" y="'+Math.max(10,yy-4)+'" text-anchor="middle" font-size="7" fill="#17385d">'+esc(compactMoney(v[0]))+'</text>'});out+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="8" font-weight="700" fill="#50657b">'+esc(x.label)+'</text>'});return'<svg class="v4-svg" viewBox="0 0 '+W+' '+H+'"><line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#dfe7ef"/>'+out+'</svg>'}

  function contractRem(r,type){r=r||{};var deg=Math.max(1,Math.round(n(r.degrau))),adj=(type==='mens'?ADJ_MENS:ADJ_ENC)[deg]||0,variable=n(r.valor)*n(r.percentual)/100;return{valor:n(r.valor),degrau:deg,percentual:n(r.percentual),ajuste:adj,variavel:variable,total:variable+adj,teto:n(r.teto),saldo:n(r.saldoAteTeto),faixa:n(r.percentualFaixa)}}
  function remCard(title,r,color){return'<section class="v4-card" style="border-top:3px solid '+color+'"><div class="v4-head"><strong>'+esc(title)+'</strong><span>Contrato AGF Tipo 12</span></div><div class="v4-rem-main">'+money(r.valor)+'</div><div class="v4-rem-meta"><div class="v4-mini"><span>Degrau</span><strong>'+integer(r.degrau)+'</strong></div><div class="v4-mini"><span>Percentual</span><strong>'+pct(r.percentual,2)+'</strong></div><div class="v4-mini"><span>Ajuste</span><strong>'+money(r.ajuste)+'</strong></div></div><div class="v4-next">Remuneração contratual estimada<b>'+money(r.total)+'</b></div><div class="v4-note">'+money(r.valor)+' × '+pct(r.percentual,2)+' + '+money(r.ajuste)+'. Ajuste convertido do PPCC do Anexo 3 a R$ 3,85.</div></section>'}
  function remTotal(a,b,total){var pa=total?a.total*100/total:0,pb=100-pa;return'<section class="v4-card"><div class="v4-head"><strong>Remuneração estimada do período</strong><span>R2 G1 + R2 G2</span></div><div class="v4-rem-total">'+money(total)+'</div><div class="v4-stacked"><span style="width:'+pa+'%;background:#00A79D"></span><span style="width:'+pb+'%;background:#F97316"></span></div><div class="v4-bars"><div class="v4-bar-row"><span>Mensageria</span><div class="v4-track"><div class="v4-fill" style="width:'+pa+'%;background:#00A79D"></div></div><strong>'+money(a.total)+' · '+pct(pa,1)+'</strong></div><div class="v4-bar-row"><span>Encomendas</span><div class="v4-track"><div class="v4-fill" style="width:'+pb+'%;background:#F97316"></div></div><strong>'+money(b.total)+' · '+pct(pb,1)+'</strong></div></div><div class="v4-note" style="margin-top:8px">Fonte: Anexo 3 do Contrato AGF Tipo 12, vigência 17/11/2025.</div></section>'}
  function opportunity(o){var e=n(o.encomendas),emb=n(o.embalagens),rate=n(o.taxaAtual);return'<section class="v4-card"><div class="v4-head"><strong>Oportunidade de embalagem</strong><span>potencial comercial</span></div><div class="v4-opportunity"><div><div class="big">'+pct(rate,1)+'</div><div class="v4-note">taxa atual</div></div><div class="v4-bars"><div class="v4-bar-row"><span>Encomendas</span><div class="v4-track"><div class="v4-fill" style="width:100%;background:#0B72D9"></div></div><strong>'+integer(e)+'</strong></div><div class="v4-bar-row"><span>Embalagens</span><div class="v4-track"><div class="v4-fill" style="width:'+Math.min(100,rate)+'%;background:#F2B500"></div></div><strong>'+integer(emb)+'</strong></div><div class="v4-bar-row"><span>Para 10%</span><div class="v4-track"><div class="v4-fill" style="width:50%;background:#00A79D"></div></div><strong>+'+integer(o.meta10&&o.meta10.adicionais)+'</strong></div></div></div></section>'}

  function boot(i){i=n(i);if(init())return;if(i<100)setTimeout(function(){boot(i+1)},100)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){boot(0)},{once:true});else boot(0);window.addEventListener('load',function(){boot(0)},{once:true});
})();
</script>
