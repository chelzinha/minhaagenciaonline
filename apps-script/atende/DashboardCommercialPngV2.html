l\"><\/b><\/div>\n      <div class=\"md-linha nec\"><span id=\"mdNecL\"><\/span><b id=\"mdNec\"><\/b><\/div>\n      <div class=\"md-selo\" id=\"mdSelo\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"rank\">\n    <div class=\"cab\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3.4 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9z\" stroke=\"#7648b6\"/>\n<path d=\"M20.4 3v2.4M19.2 4.2h2.4\" stroke=\"#EA580C\"/><\/svg><span class=\"rot\" id=\"rkTit\">Percentuais do Balc\u00e3o<\/span><span class=\"tot\" id=\"rkTot\"><\/span><\/div>\n    <div id=\"rk\" style=\"flex:1;display:flex;flex-direction:column\"><\/div>\n  <\/section>\n\n<\/div>\n<script>\n/* Dados: mesma fonte da aba Comercial do Vis\u00e3o 360 */\nconst D = __DADOS__;\nconst MEDALHA = {\"Bronze\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"30\\\" height=\\\"30\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#9A5B2E\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#9A5B2E\\\"/><\/svg>\", \"Prata\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"30\\\" height=\\\"30\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#5F6B7A\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#5F6B7A\\\"/><\/svg>\", \"Ouro\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"30\\\" height=\\\"30\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#f2a900\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#f2a900\\\"/><\/svg>\"};\n(function(d){\n  const $ = id => document.getElementById(id);\n  const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});\n  const pct = v => v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';\n  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;\n\n  const metaBase = d.metas[0].valor;\n  const proxima  = d.metas.find(m => d.realizado < m.valor) || null;\n  const rest   = Math.max(d.diasUteis - d.diasRealizados, 0);\n  const pMeta  = metaBase ? d.realizado / metaBase * 100 : 0;\n  const pTempo = d.diasUteis ? d.diasRealizados / d.diasUteis * 100 : 0;\n  const falta  = proxima ? proxima.valor - d.realizado : 0;\n  const media  = d.diasRealizados ? d.realizado / d.diasRealizados : 0;\n  const proj   = media * d.diasUteis;\n  const alvoProj = proxima || d.metas[d.metas.length - 1];\n  const dif    = proj - alvoProj.valor;\n  const porDia = rest ? falta / rest : falta;\n\n  const [p1, ...p2] = d.titulo.split(' ');\n  $('titulo').innerHTML = p2.length ? `${p1}<span class=\"marca\">${p2.join(' ')}<\/span>` : p1;\n  $('mes').textContent = `Resultado de ${d.mesRef}`;\n  $('atu').textContent = d.dataRef;\n\n  $('vReal').textContent = brl(d.realizado);\n  $('vMetaHero').textContent = brl(metaBase);\n  $('pMeta').textContent = pct(pMeta);\n  const C = 2 * Math.PI * 50;\n  $('arco').setAttribute('stroke-dasharray', `${C * Math.min(pMeta, 100) / 100} ${C}`);\n  $('fMeta').style.width = Math.min(pMeta, 100) + '%';\n  $('mTempo').style.left = Math.min(pTempo, 100) + '%';\n  $('lReal').textContent = pct(pMeta);\n  $('lTempo').textContent = pct(pTempo);\n\n  const classe = {Bronze:'bronze', Prata:'prata', Ouro:'ouro'};\n  $('metas').innerHTML = d.metas.map(m => {\n    const p = m.valor ? d.realizado / m.valor * 100 : 0;\n    const ok = d.realizado >= m.valor;\n    return `<div class=\"nivel ${classe[m.nivel] || ''} ${m === proxima ? 'alvo' : ''}\">\n      <div class=\"topo-n\"><span class=\"medalha\">${MEDALHA[m.nivel] || ''}Meta ${m.nivel}<\/span>${ok ? '<span class=\"selo-ok\">Batida<\/span>' : ''}<\/div>\n      <div class=\"num\">${brl(m.valor)}<\/div>\n      <div class=\"barra-n\"><i style=\"width:${Math.min(p,100)}%\"><\/i><\/div>\n      <div class=\"info\"><span><b>${pct(p)}<\/b> atingido<\/span><span>${ok ? 'Acima <b>' + brl(d.realizado - m.valor) + '<\/b>' : 'Faltam <b>' + brl(m.valor - d.realizado) + '<\/b>'}<\/span><\/div>\n    <\/div>`;\n  }).join('');\n\n  $('tDias').textContent = `${d.diasRealizados} de ${d.diasUteis}`;\n  $('tProj').textContent = brl(proj);\n  $('tDifL').textContent = `Diferen\u00e7a para a ${alvoProj.nivel}`;\n  $('tDif').textContent = (dif < 0 ? '- ' : '+ ') + brl(Math.abs(dif));\n  $('dDif').classList.add(dif < 0 ? 'neg' : 'pos');\n\n  $('mdRealL').innerHTML = `Realizada<small>nos ${plural(d.diasRealizados, 'dia \u00fatil passado', 'dias \u00fateis passados')}<\/small>`;\n  $('mdReal').textContent = brl(media);\n  if (falta) {\n    $('mdNecL').innerHTML = `Necess\u00e1ria \u00b7 ${proxima.nivel}<small>nos pr\u00f3ximos ${plural(rest, 'dia \u00fatil', 'dias \u00fateis')}<\/small>`;\n    $('mdNec').textContent = brl(porDia);\n    const r = porDia ? media / porDia : 0;\n    const sel = $('mdSelo');\n    if (!media) { sel.style.display = 'none'; }\n    sel.classList.add(r >= 1 ? 'ok' : 'atencao');\n    sel.textContent = r >= 1\n      ? `Ritmo atual cobre ${r.toLocaleString('pt-BR',{maximumFractionDigits:1})}x o necess\u00e1rio`\n      : `Precisa subir ${pct((1/r - 1) * 100)} no ritmo di\u00e1rio`;\n  } else {\n    $('mdNecL').innerHTML = 'Todas as metas<small>batidas no m\u00eas<\/small>';\n  }\n\n  const total = d.ranking.reduce((s, r) => s + r.valor, 0);\n  const top = [...d.ranking].sort((a, b) => b.valor - a.valor).slice(0, 3);\n  const maior = top.length ? top[0].valor : 0;\n  $('rkTot').textContent = top.length ? `Participa\u00e7\u00e3o no realizado` : '';\n  $('rk').innerHTML = top.length\n    ? top.map((r, i) => `<div class=\"linha-rk\"><span class=\"pos ${i === 0 ? 'p1' : ''}\">${i + 1}<\/span><span class=\"nome\">${r.nome}<\/span><span class=\"barra-rk\"><i style=\"width:${maior ? r.valor / maior * 100 : 0}%\"><\/i><\/span><span class=\"val\">${brl(r.valor)}<\/span><span class=\"pct\">${pct(total ? r.valor / total * 100 : 0)}<\/span><\/div>`).join('')\n    : `<div class=\"vazio\">Sem lan\u00e7amentos por colaborador no per\u00edodo<\/div>`;\n})(D);\n<\/script>\n<\/body><\/html>\n", "encomendas": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><title>AGF - resultado do m\u00eas, Encomendas<\/title>\n<style>\n\n__FONTES__\n/* Tokens: paleta em vigor do M\u00e9todo de Artes AGF v1.0 (se\u00e7\u00e3o 4) */\n:root{\n  --tinta:#00416b; --tinta-2:#0a5689; --azul:#0078D4; --amarelo:#FFD100; --ouro:#f2a900;\n  --roxo:#7648b6; --turquesa:#0D9488; --coral:#EA580C; --vermelho:#B91C1C; --verde:#16A34A;\n  --branco:#fff; --neutro:#F5F7FA; --fio:#E5E7EB; --apoio:#6B7280; --grafite:#374151;\n  --amarelo-f:#FFF8D6; --vermelho-f:#FDECEC; --roxo-f:#F4EFFE;\n  --f-tit:'Poppins','Segoe UI',Arial,sans-serif;\n  --f-txt:'Inter','Segoe UI',Roboto,Arial,sans-serif;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{width:1080px;height:1080px;overflow:hidden}\nbody{background:var(--branco);font-family:var(--f-txt);color:var(--grafite);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}\n.peca{width:1080px;height:1080px;padding:36px 48px 36px;display:flex;flex-direction:column;gap:16px}\n.peca>*{flex:none}\n.rot{font-family:var(--f-tit);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;line-height:1.2;color:var(--apoio)}\n.num{font-family:var(--f-tit);font-weight:800;letter-spacing:-.025em;white-space:nowrap;line-height:1;color:var(--tinta)}\n\n/* 1. HERO: um bloco escuro concentra o que mais importa */\n.hero{position:relative;overflow:hidden;border-radius:28px;padding:28px 38px 26px;color:#fff;\n  background:radial-gradient(620px 340px at 92% 0%,var(--tinta-2),transparent 70%),var(--tinta)}\n.h-topo{display:flex;justify-content:space-between;align-items:center;gap:20px}\n.chip{display:inline-flex;align-items:center;background:rgba(255,255,255,.12);border-radius:999px;padding:8px 18px;font-family:var(--f-tit);font-weight:700;font-size:17px;color:#fff;white-space:nowrap;letter-spacing:.12em;text-transform:uppercase}\n.chip svg{display:block}\n.ident{display:flex;flex-direction:column;align-items:flex-end;gap:10px;text-align:right;font-family:var(--f-tit);font-weight:600;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);line-height:1.3;white-space:nowrap}\n.ident b{color:#fff;font-weight:700}\n.ident .ate{font-size:20px;letter-spacing:.08em}\n.hero h1{font-family:var(--f-tit);font-weight:800;font-size:68px;white-space:nowrap;line-height:.98;letter-spacing:-.04em}\n.hero h1 .marca{display:inline-block;background:var(--amarelo);color:var(--tinta);padding:0 14px 6px;margin-left:16px;border-radius:6px}\n.h-corpo{display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px;margin-top:18px;position:relative}\n.h-corpo .rot{color:rgba(255,255,255,.66)}\n.h-corpo .valor{margin-top:8px;font-family:var(--f-tit);font-weight:800;font-size:76px;letter-spacing:-.035em;line-height:1;white-space:nowrap}\n.h-corpo .de{margin-top:10px;font-size:21px;color:rgba(255,255,255,.75)}\n.h-corpo .de b{color:#fff;font-weight:600}\n.anel{position:relative;width:150px;height:150px}\n.anel svg{width:150px;height:150px;transform:rotate(-90deg);display:block}\n.anel .meio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}\n.anel .meio b{font-family:var(--f-tit);font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1}\n.anel .meio span{font-size:16px;color:rgba(255,255,255,.7);margin-top:4px}\n/* barra de ritmo: realizado contra o tempo decorrido */\n.ritmo{margin-top:18px;position:relative}\n.ritmo .trilho{height:16px;border-radius:999px;background:rgba(255,255,255,.14);position:relative}\n.ritmo .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--amarelo)}\n.ritmo .tempo{position:absolute;top:-7px;bottom:-7px;width:4px;border-radius:2px;background:#fff;transform:translateX(-2px)}\n.ritmo .leg{display:flex;justify-content:space-between;margin-top:12px;font-size:18px;color:rgba(255,255,255,.75)}\n.ritmo .leg b{color:#fff;font-weight:600}\n.ritmo .leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}\n\n/* 2. INDICADORES: fundo neutro, sem moldura */\n.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}\n.kpi{background:var(--neutro);border-radius:18px;padding:16px 18px 17px}\n.kpi .cab{display:flex;align-items:center;gap:9px;margin-bottom:12px}\n.kpi .cab svg{flex:none;display:block}\n.kpi .rot{font-size:14.5px;letter-spacing:.07em;white-space:nowrap}\n.kpi .num{font-size:34px}\n.kpi .num small{font-size:22px;font-weight:700;color:var(--apoio);letter-spacing:0;margin-left:4px}\n.kpi.destaque{background:var(--amarelo)} .kpi.destaque .rot{color:var(--tinta)}\n\n/* 3. PROJE\u00c7\u00c3O E META POR DIA */\n.duas{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}\n.cartao{border-radius:20px;padding:18px 24px}\n.cartao .cab{display:flex;align-items:center;gap:10px;margin-bottom:10px;white-space:nowrap}\n.cartao .cab svg{display:block;flex:none}\n.cartao .cab .rot{color:var(--tinta)}\n.proj{background:var(--neutro)}\n.linhas div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--fio);font-size:20px}\n.linhas div:last-child{border-bottom:0;padding-bottom:0}\n.linhas b{font-family:var(--f-tit);font-weight:700;font-size:24px;color:var(--tinta);white-space:nowrap}\n.linhas .dif b{padding:3px 12px;border-radius:8px;font-size:23px}\n.dif.neg b{background:var(--vermelho-f);color:var(--vermelho)} .dif.pos b{background:#EAFBF0;color:#15803D}\n.mpd{background:var(--roxo-f);display:flex;flex-direction:column}\n.mpd .cab .rot{color:var(--roxo)}\n.mpd p{font-size:21px;line-height:1.4;color:var(--tinta)}\n.mpd p b{font-weight:700}\n.mpd .num{margin-top:auto;font-size:58px;color:var(--roxo)}\n.mpd .num small{display:block;margin-top:8px;font-family:var(--f-txt);font-size:18px;font-weight:500;color:var(--apoio);letter-spacing:0}\n\n/* 4. RANKING: barra de participa\u00e7\u00e3o no lugar da coluna de percentual solta */\n.rank{background:var(--neutro);border-radius:20px;padding:16px 24px 8px;flex:1 1 auto;display:flex;flex-direction:column}\n.rank .cab{display:flex;align-items:center;gap:10px;margin-bottom:6px}\n.rank .cab svg{display:block}\n.rank .cab .rot{color:var(--tinta)}\n.rank .cab .tot{margin-left:auto;font-size:17px;color:var(--apoio)}\n.linha-rk{display:grid;grid-template-columns:44px 150px 1fr 186px 100px;align-items:center;gap:16px;flex:1}\n.linha-rk + .linha-rk{border-top:1px solid var(--fio)}\n.pos{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-tit);font-weight:800;font-size:19px;color:var(--tinta);background:#fff;border:2.5px solid var(--tinta)}\n.pos.p1{background:var(--amarelo)}\n.nome{font-family:var(--f-tit);font-weight:700;font-size:24px;color:var(--tinta)}\n.barra-rk{height:12px;border-radius:999px;background:var(--fio);position:relative;overflow:hidden}\n.barra-rk i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--azul)}\n.linha-rk:first-of-type .barra-rk i{background:var(--tinta)}\n.val{text-align:right;font-family:var(--f-tit);font-weight:700;font-size:23px;color:var(--tinta);white-space:nowrap}\n.pct{text-align:right;font-family:var(--f-tit);font-weight:700;font-size:21px;color:var(--azul)}\n.vazio{flex:1;display:grid;place-items:center;font-size:18px;color:var(--apoio)}\n\n\n.kpis.dois{grid-template-columns:1fr 1fr}\n.kpis.dois .kpi{padding:20px 26px 22px}\n.kpis.dois .rot{font-size:16px}\n.kpis.dois .num{font-size:46px}\n.enc{}\n.enc .mpd p{font-size:22px}\n.enc .mpd .num{font-size:66px}\n.enc .mpd .num small{font-size:19px}\n.enc .cartao{padding:22px 26px}\n.andamento{background:var(--neutro);display:flex;flex-direction:column}\n.and2{flex:1;display:grid;grid-template-columns:1.2fr 1fr;align-items:center}\n.and2 > div{display:flex;flex-direction:column;gap:10px;padding-right:20px}\n.and2 > div + div{border-left:1px solid var(--fio);padding:0 0 0 22px}\n.and2 .rot{font-size:15.5px;letter-spacing:.08em}\n.and2 .num{font-size:84px}\n.and2 .num small{font-size:26px;font-weight:700;color:var(--apoio);letter-spacing:0;margin-left:6px}\n.and2 > div + div .num small{display:block;margin:8px 0 0}\n.mini{height:28px;border-radius:999px;background:var(--fio);position:relative;overflow:hidden;margin-top:4px}\n.mini .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--tinta);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;min-width:80px}\n.mini .fill span{font-family:var(--f-tit);font-weight:700;font-size:17px;color:#fff}\n.hero h1 .marca-total{display:inline-block;background:var(--amarelo);color:var(--tinta);padding:0 16px 6px;border-radius:6px}\n/* Encomendas: mesmos tokens e componentes do Balc\u00e3o; blocos pr\u00f3prios abaixo */\n.necessaria{background:var(--roxo-f);border-radius:20px;padding:24px 30px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;flex:1 1 auto}\n.necessaria .cab{display:flex;align-items:center;gap:10px;margin-bottom:12px;white-space:nowrap}\n.necessaria .cab svg{display:block;flex:none}\n.necessaria .cab .rot{color:var(--roxo)}\n.necessaria p{font-size:22px;line-height:1.4;color:var(--tinta)}\n.necessaria p b{font-weight:700}\n.necessaria .num{font-size:72px;color:var(--roxo);text-align:right}\n.necessaria .num small{display:block;margin-top:10px;font-family:var(--f-txt);font-size:19px;font-weight:500;color:var(--apoio);letter-spacing:0}\n.fecho{background:var(--neutro);border-radius:20px;padding:20px 26px;display:flex;align-items:center;gap:20px}\n.fecho svg{display:block;flex:none}\n.fecho .frase b{display:block;font-family:var(--f-tit);font-weight:800;font-size:26px;color:var(--tinta);letter-spacing:-.02em;line-height:1.15}\n.fecho .frase span{display:block;margin-top:4px;font-size:17.5px;color:var(--grafite);white-space:nowrap}\n.fecho .pilares{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--f-tit);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta);white-space:nowrap;gap:10px}\n.fecho .pilares i{display:block;width:3px;height:18px;border-radius:2px;background:var(--amarelo)}\n\n/* linha de metas Bronze, Prata e Ouro */\n.metas{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:14px}\n.nivel{border-radius:20px;padding:20px 22px 18px;min-width:0;background:var(--neutro);position:relative;overflow:hidden}\n.nivel::before{content:\"\";position:absolute;inset:0 0 auto 0;height:6px;background:var(--m)}\n.nivel .topo-n{display:flex;align-items:center;justify-content:space-between;gap:10px}\n.medalha{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-tit);font-weight:800;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--m2)}\n.medalha i{width:26px;height:26px;border-radius:50%;background:var(--m);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 0 0 2px var(--m2)}\n.selo-ok{font-family:var(--f-tit);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#15803D;background:#EAFBF0;border-radius:999px;padding:4px 11px}\n.nivel .num{font-size:34px;margin-top:14px}\n.nivel .barra-n{height:12px;border-radius:999px;background:var(--fio);margin-top:14px;overflow:hidden}\n.nivel .barra-n i{display:block;height:100%;border-radius:999px;background:var(--m2)}\n.nivel .info{display:flex;flex-direction:column;gap:3px;margin-top:10px;font-size:17px;color:var(--apoio);white-space:nowrap}\n.nivel .info b{font-family:var(--f-tit);font-weight:700;color:var(--tinta)}\n.nivel.alvo{background:var(--amarelo-f);box-shadow:inset 0 0 0 2px var(--ouro)}\n.bronze{--m:#D89A6A;--m2:#9A5B2E} .prata{--m:#C9D1DB;--m2:#5F6B7A} .ouro{--m:#FFD100;--m2:#B07C00}\n/* alturas naturais: sem card esticado */\n.peca{justify-content:space-between}\n.enc{flex:none !important}\n.enc .cartao{padding:22px 26px;display:flex;flex-direction:column;justify-content:center}\n.enc .cartao .cab{margin-bottom:16px}\n.and2{flex:none;align-items:start}\n.enc .mpd .num{margin-top:12px !important}\n\n/* m\u00e9dia di\u00e1ria: realizada x necess\u00e1ria */\n.md-linha{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCD3EE}\n.md-linha span{font-size:19px;color:var(--tinta);line-height:1.3}\n.md-linha span small{display:block;font-size:16px;color:var(--apoio)}\n.md-linha b{font-family:var(--f-tit);font-weight:800;font-size:38px;letter-spacing:-.02em;color:var(--tinta);white-space:nowrap}\n.md-linha.nec{border-bottom:0}\n.md-linha.nec b{color:var(--roxo)}\n.md-selo{margin-top:8px;align-self:flex-start;font-family:var(--f-tit);font-weight:700;font-size:16px;padding:6px 14px;border-radius:999px}\n.md-selo.ok{background:#EAFBF0;color:#15803D}\n.md-selo.atencao{background:var(--vermelho-f);color:var(--vermelho)}\n.medalha svg{display:block;flex:none}\n\n/* ajuste de altura com a m\u00e9dia di\u00e1ria */\n.md-linha{padding:6px 0}\n.md-linha b{font-size:34px}\n.md-linha span{font-size:18px}\n.md-linha span small{font-size:15px}\n.md-selo{font-size:15px;padding:5px 13px;margin-top:6px}\n.enc .cartao{padding:18px 24px}\n.enc .cartao .cab{margin-bottom:8px}\n.and2 .num{font-size:72px}\n.nivel{padding:16px 20px 14px}\n.nivel .num{margin-top:10px}\n.nivel .barra-n{margin-top:10px}\n.fecho{padding:16px 26px}\n.hero{padding:26px 38px 24px}\n.ritmo{margin-top:16px}\n.md-linha span{white-space:nowrap}\n.duas.enc{grid-template-columns:.92fr 1.08fr}\n<\/style><\/head><body>\n<div class=\"peca\">\n\n  <section class=\"hero\">\n    <div class=\"h-topo\">\n      <h1 id=\"titulo\"><\/h1>\n      <div class=\"ident\"><span class=\"chip\" id=\"mes\"><\/span><span class=\"ate\">At\u00e9 <b id=\"atu\"><\/b><\/span><\/div>\n    <\/div>\n    <div class=\"h-corpo\">\n      <div>\n        <div class=\"rot\" id=\"lReal\"><\/div>\n        <div class=\"valor\" id=\"vReal\"><\/div>\n        <div class=\"de\">de <b id=\"vMetaHero\"><\/b> da meta Bronze<\/div>\n      <\/div>\n      <div class=\"anel\">\n        <svg viewBox=\"0 0 120 120\">\n          <circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"rgba(255,255,255,.14)\" stroke-width=\"12\"/>\n          <circle id=\"arco\" cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"#FFD100\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"0 999\"/>\n        <\/svg>\n        <div class=\"meio\"><b id=\"pMeta\"><\/b><span>da Bronze<\/span><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"ritmo\">\n      <div class=\"trilho\"><div class=\"fill\" id=\"fMeta\"><\/div><div class=\"tempo\" id=\"mTempo\"><\/div><\/div>\n      <div class=\"leg\">\n        <span><i style=\"background:#FFD100\"><\/i>Percentual atingido <b id=\"legReal\"><\/b><\/span>\n        <span><i style=\"background:#fff\"><\/i>M\u00eas decorrido <b id=\"legTempo\"><\/b><\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"metas\" id=\"metas\"><\/section>\n\n  <section class=\"duas enc\">\n    <div class=\"cartao andamento\">\n      <div class=\"cab\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9.2\" stroke=\"#EA580C\"/>\n<path d=\"M12 6.6V12l3.8 2.2\" stroke=\"#00416b\"/><\/svg><span class=\"rot\">Andamento do m\u00eas<\/span><\/div>\n      <div class=\"and2\">\n        <div><span class=\"rot\">Dias \u00fateis<\/span><div class=\"num\"><span id=\"kDias\"><\/span><small id=\"kDe\"><\/small><\/div>\n          <div class=\"mini\"><div class=\"fill\" id=\"fDias\"><span id=\"pDias\"><\/span><\/div><\/div><\/div>\n        <div><span class=\"rot\">Dias restantes<\/span><div class=\"num\"><span id=\"kRest\"><\/span><small id=\"kRestS\"><\/small><\/div><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cartao mpd\">\n      <div class=\"cab\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"4.6\" cy=\"12\" r=\"2.5\" stroke=\"#7648b6\"/>\n<circle cx=\"12\" cy=\"12\" r=\"2.5\" stroke=\"#7648b6\"/>\n<circle cx=\"19.4\" cy=\"12\" r=\"2.5\" stroke=\"#EA580C\"/>\n<path d=\"M7.1 12h2.4M14.5 12h2.4\" stroke=\"#7648b6\"/>\n<path d=\"M4.6 6.4V3.2M12 6.4V3.2M19.4 6.4V3.2\" stroke=\"#EA580C\"/><\/svg><span class=\"rot\">M\u00e9dia di\u00e1ria<\/span><\/div>\n      <div class=\"md-linha\"><span id=\"mdRealL\"><\/span><b id=\"mdReal\"><\/b><\/div>\n      <div class=\"md-linha nec\"><span id=\"mdNecL\"><\/span><b id=\"mdNec\"><\/b><\/div>\n      <div class=\"md-selo\" id=\"mdSelo\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"fecho\">\n    <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"64\" height=\"64\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.6 6.6a1 1 0 0 1 1-1h9.2a1 1 0 0 1 1 1v9.8H2.6z\" stroke=\"#0D9488\"/>\n<path d=\"M13.8 9.6h3.3a1.4 1.4 0 0 1 1.12.56l2.5 3.34a1.4 1.4 0 0 1 .28.84v2.06h-7.2\" stroke=\"#0D9488\"/>\n<circle cx=\"7\" cy=\"18.4\" r=\"2.2\" stroke=\"#EA580C\"/>\n<circle cx=\"17.6\" cy=\"18.4\" r=\"2.2\" stroke=\"#EA580C\"/><\/svg>\n    <div class=\"frase\"><b>Seguimos em movimento!<\/b><span>Encomendas que aproximam pessoas e oportunidades<\/span><\/div>\n    <div class=\"pilares\">Foco<i><\/i>Planejamento<i><\/i>Resultado<\/div>\n  <\/section>\n\n<\/div>\n<script>\n/* Dados: mesma fonte da aba Comercial do Vis\u00e3o 360 */\nconst D = __DADOS__;\nconst MEDALHA = {\"Bronze\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"30\\\" height=\\\"30\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#9A5B2E\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#9A5B2E\\\"/><\/svg>\", \"Prata\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"30\\\" height=\\\"30\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#5F6B7A\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#5F6B7A\\\"/><\/svg>\", \"Ouro\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"30\\\" height=\\\"30\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#f2a900\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#f2a900\\\"/><\/svg>\"};\n(function(d){\n  const $ = id => document.getElementById(id);\n  const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});\n  const pct = v => v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';\n  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;\n\n  const metaBase = d.metas[0].valor;\n  const proxima = d.metas.find(m => d.realizado < m.valor) || null;\n  const pMeta  = metaBase ? d.realizado / metaBase * 100 : 0;\n  const pTempo = d.diasMes ? d.diaAtual / d.diasMes * 100 : 0;\n  const falta  = proxima ? proxima.valor - d.realizado : 0;\n  const rest   = Math.max(d.diasUteisRestantes, 0);\n  const porDia = rest ? falta / rest : falta;\n  const curta  = d.dataRef.slice(0, 5);\n\n  $('titulo').innerHTML = `<span class=\"marca-total\">${d.titulo}<\/span>`;\n  $('mes').textContent = `Resultado de ${d.mesRef}`;\n  $('atu').textContent = d.dataRef;\n  $('lReal').textContent = `Realizado at\u00e9 ${curta}`;\n  $('vReal').textContent = brl(d.realizado);\n  $('vMetaHero').textContent = `${brl(metaBase)}`;\n  $('pMeta').textContent = pct(pMeta);\n  const C = 2 * Math.PI * 50;\n  $('arco').setAttribute('stroke-dasharray', `${C * Math.min(pMeta, 100) / 100} ${C}`);\n  $('fMeta').style.width = Math.min(pMeta, 100) + '%';\n  $('mTempo').style.left = Math.min(pTempo, 100) + '%';\n  $('legReal').textContent = pct(pMeta);\n  $('legTempo').textContent = pct(pTempo);\n\n  const classe = {Bronze:'bronze', Prata:'prata', Ouro:'ouro'};\n  const alvo = d.metas.find(m => d.realizado < m.valor);\n  $('metas').innerHTML = d.metas.map(m => {\n    const p = m.valor ? d.realizado / m.valor * 100 : 0;\n    const ok = d.realizado >= m.valor;\n    return `<div class=\"nivel ${classe[m.nivel] || ''} ${m === alvo ? 'alvo' : ''}\">\n      <div class=\"topo-n\"><span class=\"medalha\">${MEDALHA[m.nivel] || \"\"}Meta ${m.nivel}<\/span>${ok ? '<span class=\"selo-ok\">Batida<\/span>' : ''}<\/div>\n      <div class=\"num\">${brl(m.valor)}<\/div>\n      <div class=\"barra-n\"><i style=\"width:${Math.min(p,100)}%\"><\/i><\/div>\n      <div class=\"info\"><span><b>${pct(p)}<\/b> atingido<\/span><span>${ok ? 'Acima <b>' + brl(d.realizado - m.valor) + '<\/b>' : 'Faltam <b>' + brl(m.valor - d.realizado) + '<\/b>'}<\/span><\/div>\n    <\/div>`;\n  }).join('');\n  $('kDias').textContent = d.diaAtual;\n  $('kDe').textContent = `de ${d.diasMes}`;\n  $('kRest').textContent = rest;\n  $('fDias').style.width = Math.min(pTempo, 100) + '%';\n  $('pDias').textContent = pct(pTempo);\n  $('kRestS').textContent = rest === 1 ? 'dia \u00fatil' : 'dias \u00fateis';\n\n  const ur = d.diasUteisRealizados || 0;\n  const mediaReal = ur ? d.realizado / ur : 0;\n  $('mdRealL').innerHTML = `Realizada<small>nos ${plural(ur, 'dia \u00fatil passado', 'dias \u00fateis passados')}<\/small>`;\n  $('mdReal').textContent = brl(mediaReal);\n  if (falta) {\n    $('mdNecL').innerHTML = `Necess\u00e1ria${proxima ? ' \u00b7 ' + proxima.nivel : ''}<small>nos pr\u00f3ximos ${plural(rest, 'dia \u00fatil', 'dias \u00fateis')}<\/small>`;\n    $('mdNec').textContent = brl(porDia);\n    const r = porDia ? mediaReal / porDia : 0;\n    const sel = $('mdSelo');\n    if (!mediaReal) { sel.style.display = 'none'; }\n    sel.classList.add(r >= 1 ? 'ok' : 'atencao');\n    sel.textContent = r >= 1\n      ? `Ritmo atual cobre ${r.toLocaleString('pt-BR',{maximumFractionDigits:1})}x o necess\u00e1rio`\n      : `Precisa subir ${pct((1/r - 1) * 100)} no ritmo di\u00e1rio`;\n  } else {\n    $('mdNecL').innerHTML = 'Todas as metas<small>batidas no m\u00eas<\/small>';\n    $('mdNec').textContent = '';\n  }\n})(D);\n<\/script>\n<\/body><\/html>\n", "metro": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><title>AGF - resultado do m\u00eas, Metr\u00f4<\/title>\n<style>\n__FONTES__\n/* Tokens: paleta em vigor do M\u00e9todo de Artes AGF v1.0 (se\u00e7\u00e3o 4) */\n:root{\n  --tinta:#00416b; --tinta-2:#0a5689; --azul:#0078D4; --amarelo:#FFD100; --ouro:#f2a900;\n  --roxo:#7648b6; --turquesa:#0D9488; --coral:#EA580C; --vermelho:#B91C1C; --verde:#16A34A;\n  --branco:#fff; --neutro:#F5F7FA; --fio:#E5E7EB; --apoio:#6B7280; --grafite:#374151;\n  --amarelo-f:#FFF8D6; --vermelho-f:#FDECEC; --roxo-f:#F4EFFE;\n  --f-tit:'Poppins','Segoe UI',Arial,sans-serif;\n  --f-txt:'Inter','Segoe UI',Roboto,Arial,sans-serif;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{width:1080px;height:1080px;overflow:hidden}\nbody{background:var(--branco);font-family:var(--f-txt);color:var(--grafite);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}\n.peca{width:1080px;height:1080px;padding:36px 48px 36px;display:flex;flex-direction:column;gap:16px}\n.peca>*{flex:none}\n.rot{font-family:var(--f-tit);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;line-height:1.2;color:var(--apoio)}\n.num{font-family:var(--f-tit);font-weight:800;letter-spacing:-.025em;white-space:nowrap;line-height:1;color:var(--tinta)}\n\n/* 1. HERO: um bloco escuro concentra o que mais importa */\n.hero{position:relative;overflow:hidden;border-radius:28px;padding:28px 38px 26px;color:#fff;\n  background:radial-gradient(620px 340px at 92% 0%,var(--tinta-2),transparent 70%),var(--tinta)}\n.h-topo{display:flex;justify-content:space-between;align-items:center;gap:20px}\n.chip{display:inline-flex;align-items:center;background:rgba(255,255,255,.12);border-radius:999px;padding:8px 18px;font-family:var(--f-tit);font-weight:700;font-size:17px;color:#fff;white-space:nowrap;letter-spacing:.12em;text-transform:uppercase}\n.chip svg{display:block}\n.ident{display:flex;flex-direction:column;align-items:flex-end;gap:10px;text-align:right;font-family:var(--f-tit);font-weight:600;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);line-height:1.3;white-space:nowrap}\n.ident b{color:#fff;font-weight:700}\n.ident .ate{font-size:20px;letter-spacing:.08em}\n.hero h1{font-family:var(--f-tit);font-weight:800;font-size:68px;white-space:nowrap;line-height:.98;letter-spacing:-.04em}\n.hero h1 .marca{display:inline-block;background:var(--amarelo);color:var(--tinta);padding:0 14px 6px;margin-left:16px;border-radius:6px}\n.h-corpo{display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px;margin-top:18px;position:relative}\n.h-corpo .rot{color:rgba(255,255,255,.66)}\n.h-corpo .valor{margin-top:8px;font-family:var(--f-tit);font-weight:800;font-size:76px;letter-spacing:-.035em;line-height:1;white-space:nowrap}\n.h-corpo .de{margin-top:10px;font-size:21px;color:rgba(255,255,255,.75)}\n.h-corpo .de b{color:#fff;font-weight:600}\n.anel{position:relative;width:150px;height:150px}\n.anel svg{width:150px;height:150px;transform:rotate(-90deg);display:block}\n.anel .meio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}\n.anel .meio b{font-family:var(--f-tit);font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1}\n.anel .meio span{font-size:16px;color:rgba(255,255,255,.7);margin-top:4px}\n/* barra de ritmo: realizado contra o tempo decorrido */\n.ritmo{margin-top:18px;position:relative}\n.ritmo .trilho{height:16px;border-radius:999px;background:rgba(255,255,255,.14);position:relative}\n.ritmo .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--amarelo)}\n.ritmo .tempo{position:absolute;top:-7px;bottom:-7px;width:4px;border-radius:2px;background:#fff;transform:translateX(-2px)}\n.ritmo .leg{display:flex;justify-content:space-between;margin-top:12px;font-size:18px;color:rgba(255,255,255,.75)}\n.ritmo .leg b{color:#fff;font-weight:600}\n.ritmo .leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}\n\n/* 2. INDICADORES: fundo neutro, sem moldura */\n.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}\n.kpi{background:var(--neutro);border-radius:18px;padding:16px 18px 17px}\n.kpi .cab{display:flex;align-items:center;gap:9px;margin-bottom:12px}\n.kpi .cab svg{flex:none;display:block}\n.kpi .rot{font-size:14.5px;letter-spacing:.07em;white-space:nowrap}\n.kpi .num{font-size:34px}\n.kpi .num small{font-size:22px;font-weight:700;color:var(--apoio);letter-spacing:0;margin-left:4px}\n.kpi.destaque{background:var(--amarelo)} .kpi.destaque .rot{color:var(--tinta)}\n\n/* 3. PROJE\u00c7\u00c3O E META POR DIA */\n.duas{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}\n.cartao{border-radius:20px;padding:18px 24px}\n.cartao .cab{display:flex;align-items:center;gap:10px;margin-bottom:10px;white-space:nowrap}\n.cartao .cab svg{display:block;flex:none}\n.cartao .cab .rot{color:var(--tinta)}\n.proj{background:var(--neutro)}\n.linhas div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--fio);font-size:20px}\n.linhas div:last-child{border-bottom:0;padding-bottom:0}\n.linhas b{font-family:var(--f-tit);font-weight:700;font-size:24px;color:var(--tinta);white-space:nowrap}\n.linhas .dif b{padding:3px 12px;border-radius:8px;font-size:23px}\n.dif.neg b{background:var(--vermelho-f);color:var(--vermelho)} .dif.pos b{background:#EAFBF0;color:#15803D}\n.mpd{background:var(--roxo-f);display:flex;flex-direction:column}\n.mpd .cab .rot{color:var(--roxo)}\n.mpd p{font-size:21px;line-height:1.4;color:var(--tinta)}\n.mpd p b{font-weight:700}\n.mpd .num{margin-top:auto;font-size:58px;color:var(--roxo)}\n.mpd .num small{display:block;margin-top:8px;font-family:var(--f-txt);font-size:18px;font-weight:500;color:var(--apoio);letter-spacing:0}\n\n/* 4. RANKING: barra de participa\u00e7\u00e3o no lugar da coluna de percentual solta */\n.rank{background:var(--neutro);border-radius:20px;padding:16px 24px 8px;flex:1 1 auto;display:flex;flex-direction:column}\n.rank .cab{display:flex;align-items:center;gap:10px;margin-bottom:6px}\n.rank .cab svg{display:block}\n.rank .cab .rot{color:var(--tinta)}\n.rank .cab .tot{margin-left:auto;font-size:17px;color:var(--apoio)}\n.linha-rk{display:grid;grid-template-columns:44px 150px 1fr 186px 100px;align-items:center;gap:16px;flex:1}\n.linha-rk + .linha-rk{border-top:1px solid var(--fio)}\n.pos{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-tit);font-weight:800;font-size:19px;color:var(--tinta);background:#fff;border:2.5px solid var(--tinta)}\n.pos.p1{background:var(--amarelo)}\n.nome{font-family:var(--f-tit);font-weight:700;font-size:24px;color:var(--tinta)}\n.barra-rk{height:12px;border-radius:999px;background:var(--fio);position:relative;overflow:hidden}\n.barra-rk i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--azul)}\n.linha-rk:first-of-type .barra-rk i{background:var(--tinta)}\n.val{text-align:right;font-family:var(--f-tit);font-weight:700;font-size:23px;color:var(--tinta);white-space:nowrap}\n.pct{text-align:right;font-family:var(--f-tit);font-weight:700;font-size:21px;color:var(--azul)}\n.vazio{flex:1;display:grid;place-items:center;font-size:18px;color:var(--apoio)}\n<\/style>\n<style id=\"balcao-extra\">\n.peca{gap:14px;padding-bottom:30px}.hero{padding:24px 38px 22px}.h-corpo{margin-top:10px}.ritmo{margin-top:14px}.linhas div{padding:6px 0}.cartao{padding:16px 24px}.rank{padding:14px 24px 6px}\n\n/* linha de metas Bronze, Prata e Ouro */\n.metas{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:14px}\n.nivel{border-radius:20px;padding:20px 22px 18px;min-width:0;background:var(--neutro);position:relative;overflow:hidden}\n.nivel::before{content:\"\";position:absolute;inset:0 0 auto 0;height:6px;background:var(--m)}\n.nivel .topo-n{display:flex;align-items:center;justify-content:space-between;gap:10px}\n.medalha{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-tit);font-weight:800;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--m2)}\n.medalha i{width:26px;height:26px;border-radius:50%;background:var(--m);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 0 0 2px var(--m2)}\n.selo-ok{font-family:var(--f-tit);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#15803D;background:#EAFBF0;border-radius:999px;padding:4px 11px}\n.nivel .num{font-size:34px;margin-top:14px}\n.nivel .barra-n{height:12px;border-radius:999px;background:var(--fio);margin-top:14px;overflow:hidden}\n.nivel .barra-n i{display:block;height:100%;border-radius:999px;background:var(--m2)}\n.nivel .info{display:flex;flex-direction:column;gap:3px;margin-top:10px;font-size:17px;color:var(--apoio);white-space:nowrap}\n.nivel .info b{font-family:var(--f-tit);font-weight:700;color:var(--tinta)}\n.nivel.alvo{background:var(--amarelo-f);box-shadow:inset 0 0 0 2px var(--ouro)}\n.bronze{--m:#D89A6A;--m2:#9A5B2E} .prata{--m:#C9D1DB;--m2:#5F6B7A} .ouro{--m:#FFD100;--m2:#B07C00}\n/* m\u00e9dia di\u00e1ria: realizada x necess\u00e1ria */\n.md-linha{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid #DCD3EE}\n.md-linha span{font-size:19px;color:var(--tinta);line-height:1.3}\n.md-linha span small{display:block;font-size:16px;color:var(--apoio)}\n.md-linha b{font-family:var(--f-tit);font-weight:800;font-size:38px;letter-spacing:-.02em;color:var(--tinta);white-space:nowrap}\n.md-linha.nec{border-bottom:0}\n.md-linha.nec b{color:var(--roxo)}\n.md-selo{margin-top:8px;align-self:flex-start;font-family:var(--f-tit);font-weight:700;font-size:16px;padding:6px 14px;border-radius:999px}\n.md-selo.ok{background:#EAFBF0;color:#15803D}\n.md-selo.atencao{background:var(--vermelho-f);color:var(--vermelho)}\n.medalha svg{display:block;flex:none}\n\n/* ajuste de altura com a m\u00e9dia di\u00e1ria */\n.md-linha{padding:6px 0}\n.md-linha b{font-size:34px}\n.md-linha span{font-size:18px}\n.md-linha span small{font-size:15px}\n.md-selo{font-size:15px;padding:5px 13px;margin-top:6px}\n.enc .cartao{padding:18px 24px}\n.enc .cartao .cab{margin-bottom:8px}\n.and2 .num{font-size:72px}\n.nivel{padding:16px 20px 14px}\n.nivel .num{margin-top:10px}\n.nivel .barra-n{margin-top:10px}\n.fecho{padding:16px 26px}\n.hero{padding:26px 38px 24px}\n.ritmo{margin-top:16px}\n.md-linha span{white-space:nowrap}\n.duas.enc{grid-template-columns:.92fr 1.08fr}\n\n.md-linha{padding:6px 0}.md-linha b{font-size:34px}.md-linha span{font-size:18px;white-space:nowrap}.md-linha span small{font-size:15px}\n.md-selo{font-size:15px;padding:5px 13px;margin-top:6px}\n.nivel{padding:16px 20px 14px}.nivel .num{margin-top:10px}.nivel .barra-n{margin-top:10px}\n.mpd .cab{margin-bottom:6px !important}\n<\/style><style id=\"metro-extra\">\n.peca{justify-content:space-between;gap:18px;padding:40px 48px 40px}\n.hero h1 .marca-total{display:inline-block;background:var(--amarelo);color:var(--tinta);padding:0 18px 6px;border-radius:6px}\n.hero{padding:32px 40px 30px}\n.h-corpo{margin-top:22px}\n.h-corpo .valor{font-size:88px}\n.anel,.anel svg{width:180px !important;height:180px !important}\n.anel .meio b{font-size:32px !important}\n.ritmo{margin-top:26px}\n.ritmo .trilho{height:20px}\n.nivel{padding:22px 24px 20px}\n.nivel .num{font-size:38px;margin-top:14px}\n.nivel .barra-n{height:14px;margin-top:14px}\n.nivel .info{font-size:18px;gap:5px;margin-top:12px}\n.cartao{padding:26px 24px}\n.cartao .cab{margin-bottom:14px !important}\n.linhas div{padding:12px 0;font-size:21px}\n.linhas b{font-size:26px}\n.md-linha{padding:12px 0}\n.md-linha b{font-size:34px}\n.duas{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}\n.md-linha span{font-size:18.5px}\n.md-linha span small{font-size:16px}\n.md-selo{font-size:16px;margin-top:12px}\n<\/style><\/head><body>\n<div class=\"peca\">\n\n  <section class=\"hero\">\n    <div class=\"h-topo\">\n      <h1 id=\"titulo\"><\/h1>\n      <div class=\"ident\"><span class=\"chip\" id=\"mes\"><\/span><span class=\"ate\">At\u00e9 <b id=\"atu\"><\/b><\/span><\/div>\n    <\/div>\n    <div class=\"h-corpo\">\n      <div>\n        <div class=\"rot\">Realizado at\u00e9 agora<\/div>\n        <div class=\"valor\" id=\"vReal\"><\/div>\n        <div class=\"de\">de <b id=\"vMetaHero\"><\/b> da meta Bronze<\/div>\n      <\/div>\n      <div class=\"anel\">\n        <svg viewBox=\"0 0 120 120\">\n          <circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"rgba(255,255,255,.14)\" stroke-width=\"12\"/>\n          <circle id=\"arco\" cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"#FFD100\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"0 999\"/>\n        <\/svg>\n        <div class=\"meio\"><b id=\"pMeta\"><\/b><span>da Bronze<\/span><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"ritmo\">\n      <div class=\"trilho\"><div class=\"fill\" id=\"fMeta\"><\/div><div class=\"tempo\" id=\"mTempo\"><\/div><\/div>\n      <div class=\"leg\">\n        <span><i style=\"background:#FFD100\"><\/i>Realizado <b id=\"lReal\"><\/b><\/span>\n        <span><i style=\"background:#fff\"><\/i>M\u00eas decorrido <b id=\"lTempo\"><\/b><\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"metas\" id=\"metas\"><\/section>\n\n  <section class=\"duas\">\n    <div class=\"cartao proj\">\n      <div class=\"cab\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.6 2.9h11.2l3.6 3.6v12.4a2 2 0 0 1-2 2H4.6a2 2 0 0 1-2-2V4.9a2 2 0 0 1 2-2Z\" stroke=\"#00416b\"/>\n<path d=\"M15.4 2.9v3.9h3.9\" stroke=\"#00416b\"/>\n<path d=\"M7 16.6v-3M10.6 16.6v-5.6M14.2 16.6v-2\" stroke=\"#0078D4\"/><\/svg><span class=\"rot\">Proje\u00e7\u00e3o do m\u00eas, com o realizado<\/span><\/div>\n      <div class=\"linhas\">\n        <div><span>Dias \u00fateis realizados<\/span><b id=\"tDias\"><\/b><\/div>\n        <div><span>Proje\u00e7\u00e3o para o m\u00eas<\/span><b id=\"tProj\"><\/b><\/div>\n        <div class=\"dif\" id=\"dDif\"><span id=\"tDifL\"><\/span><b id=\"tDif\"><\/b><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cartao mpd\">\n      <div class=\"cab\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"4.6\" cy=\"12\" r=\"2.5\" stroke=\"#7648b6\"/>\n<circle cx=\"12\" cy=\"12\" r=\"2.5\" stroke=\"#7648b6\"/>\n<circle cx=\"19.4\" cy=\"12\" r=\"2.5\" stroke=\"#EA580C\"/>\n<path d=\"M7.1 12h2.4M14.5 12h2.4\" stroke=\"#7648b6\"/>\n<path d=\"M4.6 6.4V3.2M12 6.4V3.2M19.4 6.4V3.2\" stroke=\"#EA580C\"/><\/svg><span class=\"rot\">M\u00e9dia di\u00e1ria<\/span><\/div>\n      <div class=\"md-linha\"><span id=\"mdRealL\"><\/span><b id=\"mdReal\"><\/b><\/div>\n      <div class=\"md-linha nec\"><span id=\"mdNecL\"><\/span><b id=\"mdNec\"><\/b><\/div>\n      <div class=\"md-selo\" id=\"mdSelo\"><\/div>\n    <\/div>\n  <\/section>\n\n<\/div>\n<script>\n/* Dados: mesma fonte da aba Comercial do Vis\u00e3o 360 */\nconst D = __DADOS__;\nconst MEDALHA = {\"Bronze\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"32\\\" height=\\\"32\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#9A5B2E\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#9A5B2E\\\"/><\/svg>\", \"Prata\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"32\\\" height=\\\"32\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#5F6B7A\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#5F6B7A\\\"/><\/svg>\", \"Ouro\": \"<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"32\\\" height=\\\"32\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke-width=\\\"1.9\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M6.4 2.6h3.5l2.1 4.3 2.1-4.3h3.5l-3.3 6.1M6.4 2.6l3.3 6.1\\\" stroke=\\\"#00416b\\\"/>\\n<circle cx=\\\"12\\\" cy=\\\"14.9\\\" r=\\\"6.3\\\" stroke=\\\"#f2a900\\\"/>\\n<path d=\\\"M12.00 11.80L12.79 13.81L14.95 13.94L13.28 15.32L13.82 17.41L12.00 16.25L10.18 17.41L10.72 15.32L9.05 13.94L11.21 13.81Z\\\" stroke=\\\"#f2a900\\\"/><\/svg>\"};\n(function(d){\n  const $ = id => document.getElementById(id);\n  const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});\n  const pct = v => v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';\n  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;\n\n  const metaBase = d.metas[0].valor;\n  const proxima  = d.metas.find(m => d.realizado < m.valor) || null;\n  const rest   = Math.max(d.diasUteis - d.diasRealizados, 0);\n  const pMeta  = metaBase ? d.realizado / metaBase * 100 : 0;\n  const pTempo = d.diasUteis ? d.diasRealizados / d.diasUteis * 100 : 0;\n  const falta  = proxima ? proxima.valor - d.realizado : 0;\n  const media  = d.diasRealizados ? d.realizado / d.diasRealizados : 0;\n  const proj   = media * d.diasUteis;\n  const alvoProj = proxima || d.metas[d.metas.length - 1];\n  const dif    = proj - alvoProj.valor;\n  const porDia = rest ? falta / rest : falta;\n\n  const [p1, ...p2] = d.titulo.split(' ');\n  $('titulo').innerHTML = p2.length ? `${p1}<span class=\"marca\">${p2.join(' ')}<\/span>` : `<span class=\"marca-total\">${p1}<\/span>`;\n  $('mes').textContent = `Resultado de ${d.mesRef}`;\n  $('atu').textContent = d.dataRef;\n\n  $('vReal').textContent = brl(d.realizado);\n  $('vMetaHero').textContent = brl(metaBase);\n  $('pMeta').textContent = pct(pMeta);\n  const C = 2 * Math.PI * 50;\n  $('arco').setAttribute('stroke-dasharray', `${C * Math.min(pMeta, 100) / 100} ${C}`);\n  $('fMeta').style.width = Math.min(pMeta, 100) + '%';\n  $('mTempo').style.left = Math.min(pTempo, 100) + '%';\n  $('lReal').textContent = pct(pMeta);\n  $('lTempo').textContent = pct(pTempo);\n\n  const classe = {Bronze:'bronze', Prata:'prata', Ouro:'ouro'};\n  $('metas').innerHTML = d.metas.map(m => {\n    const p = m.valor ? d.realizado / m.valor * 100 : 0;\n    const ok = d.realizado >= m.valor;\n    return `<div class=\"nivel ${classe[m.nivel] || ''} ${m === proxima ? 'alvo' : ''}\">\n      <div class=\"topo-n\"><span class=\"medalha\">${MEDALHA[m.nivel] || ''}Meta ${m.nivel}<\/span>${ok ? '<span class=\"selo-ok\">Batida<\/span>' : ''}<\/div>\n      <div class=\"num\">${brl(m.valor)}<\/div>\n      <div class=\"barra-n\"><i style=\"width:${Math.min(p,100)}%\"><\/i><\/div>\n      <div class=\"info\"><span><b>${pct(p)}<\/b> atingido<\/span><span>${ok ? 'Acima <b>' + brl(d.realizado - m.valor) + '<\/b>' : 'Faltam <b>' + brl(m.valor - d.realizado) + '<\/b>'}<\/span><\/div>\n    <\/div>`;\n  }).join('');\n\n  $('tDias').textContent = `${d.diasRealizados} de ${d.diasUteis}`;\n  $('tProj').textContent = brl(proj);\n  $('tDifL').textContent = `Diferen\u00e7a para a ${alvoProj.nivel}`;\n  $('tDif').textContent = (dif < 0 ? '- ' : '+ ') + brl(Math.abs(dif));\n  $('dDif').classList.add(dif < 0 ? 'neg' : 'pos');\n\n  $('mdRealL').innerHTML = `Realizada<small>nos ${plural(d.diasRealizados, 'dia \u00fatil passado', 'dias \u00fateis passados')}<\/small>`;\n  $('mdReal').textContent = brl(media);\n  if (falta) {\n    $('mdNecL').innerHTML = `Necess\u00e1ria \u00b7 ${proxima.nivel}<small>nos pr\u00f3ximos ${plural(rest, 'dia \u00fatil', 'dias \u00fateis')}<\/small>`;\n    $('mdNec').textContent = brl(porDia);\n    const r = porDia ? media / porDia : 0;\n    const sel = $('mdSelo');\n    if (!media) { sel.style.display = 'none'; }\n    sel.classList.add(r >= 1 ? 'ok' : 'atencao');\n    sel.textContent = r >= 1\n      ? `Ritmo atual cobre ${r.toLocaleString('pt-BR',{maximumFractionDigits:1})}x o necess\u00e1rio`\n      : `Precisa subir ${pct((1/r - 1) * 100)} no ritmo di\u00e1rio`;\n  } else {\n    $('mdNecL').innerHTML = 'Todas as metas<small>batidas no m\u00eas<\/small>';\n  }\n\n})(D);\n<\/script>\n<\/body><\/html>\n", "fontes": "@font-face{font-family:'Poppins';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,d09GMgABAAAAABx8AAwAAAAAOeAAABwqAAQBBgAAAAAAAAAAAAAAAAAAAAAAAAAAGyAcMAZgAGwK4XDNQgE2AiQDhjgLgx4ABCAFgxIHIBtBLbMRVTdHLTvZf5lgGzD1x2rRQBsRNl00tkXUrl4dO1bH8fbBffd/56jwYgjiknh+YUQcYonLe+h21kZIMsvzz+8PvnX2fV9CiHJTgyZPUqiTBEc2iIm8fv3a3u7/h3g0q2JVtASGkHb6RiA327vMdIZKKTo8v83/49yMOTM2MQDJEkHqkhIGaAOKgIUKJjorNrBib89truurqxeVq3yxevG3PffbT5PKy94UArpPWo0ksioQHBQciNMJcbIyE/kb/CvVrv9fW/mvqJaTeyGz3kaKKiQ9xHviDltYx8RX4qvmE/Wv9vc6y/bZ8s7IFyByukvRxRuof4qa61Rf/1v4ox3ZWpC0XrKXQPaRbF9hKeT1BWn6bLd3VcI6BIeQW6Dpc2mq9PVVgd1Qc+x7CzYwrQeX9Wc/zYKau93sBSgj8BgOwP71iSgwVtUmHjt2ZeQAHx7o3TT16KguPM/CsDPlTWSwyYMxiCxieUMrTZ51kIt0L2B/MahjyJXxUzMKX7GZPqi9h8RqcAVs8ZG1Mf8vMg21cYiulLW5CFgsSg+TOt0z2uyx1u7+TxXEEztZXdyCRcM2whJhCNiR1VW88M5mKCwKFnf5R9A/71c+O+nbp1dPesDDNP6KBup6wKfAhIkAU9cA0EYjfCUiluqcnAAjs/eNVOi86HO4n9KFyBaj4ELnyckl4OqfaUR64RgZJgFqAFPFOX++2tjMW8DX9illCEJBD28hcaTXjmNtxkmqBMKQuuWVCgIjrJxTb6A/eEiNSbjCZQfHVJ2N6IakX5cFbI//NV+thzBJtt3jguHJ5ihl31IRzuh1mSF6eLcYTV3KsHP1XGOmtimBTFi2yLW+fGy2cd0+3nEfENPtiH3gwTNBGjVoR8SaR5zQ36KtJrm0kKoi7C9K var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var NOMES = { balcao: 'Balcão AGF', encomendas: 'Encomendas', metro: 'Metrô' };

function n(v){ v = Number(v || 0); return Number.isFinite(v) ? v : 0; }
function clean(v){ return String(v == null ? '' : v).trim(); }
function titleName(v){ v = clean(v).toLowerCase(); return v ? v.charAt(0).toUpperCase() + v.slice(1) : ''; }

function dashboardData(){
  try {
    if (typeof window.ATENDE_getDashboardDataV4 === 'function') return window.ATENDE_getDashboardDataV4() || {};
  } catch (_) {}
  return {};
}

function readEndDate(data){
  var input = document.getElementById('dataFim');
  var value = clean(input && input.value);
  if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
  var rk = data && data.rankingBalcao;
  value = clean(rk && rk.periodo && rk.periodo.fim);
  return /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : '';
}

function dateBr(iso){
  var m = clean(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}

function mesReferencia(competencia, iso){
  var m = clean(competencia).match(/^(\d{4})-(\d{2})/) || clean(iso).match(/^(\d{4})-(\d{2})/);
  return m ? MESES[Number(m[2]) - 1] + ' ' + m[1] : '';
}

function metasDe(config, prefixo){
  return [['Bronze', 'Bronze'], ['Prata', 'Prata'], ['Ouro', 'Ouro']]
    .map(function(par){ return { nivel: par[0], valor: n(config[prefixo + par[1]]) }; })
    .filter(function(m){ return m.valor > 0; });
}

/* Monta o JSON que o molde espera, com os mesmos números da tela */
function montarDados(scope){
  var data = dashboardData();
  var metas = data.metas || {};
  var config = metas.config || {};
  var realizado = metas.realizado || {};
  var fim = readEndDate(data);

  var base = {
    titulo: NOMES[scope],
    mesRef: mesReferencia(metas.competencia, fim),
    dataRef: dateBr(fim),
    realizado: n(realizado[scope]),
    metas: metasDe(config, scope)
  };

  var diasMes = n(config.diasUteisMes);
  var diasFeitos = n(config.diasUteisRealizados);

  if (!base.metas.length || base.metas[0].nivel !== 'Bronze') {
    throw new Error('A meta Bronze de ' + NOMES[scope] + ' não está configurada nas metas do mês.');
  }
  if (!diasMes) {
    throw new Error('Os dias úteis do mês não estão configurados nas metas do mês.');
  }
  if (!base.dataRef || !base.mesRef) {
    throw new Error('Período do painel não identificado. Selecione as datas e tente de novo.');
  }

  if (scope === 'encomendas') {
    base.diaAtual = diasFeitos;
    base.diasMes = diasMes;
    base.diasUteisRealizados = diasFeitos;
    base.diasUteisRestantes = Math.max(diasMes - diasFeitos, 0);
    return base;
  }

  base.diasUteis = diasMes;
  base.diasRealizados = diasFeitos;
  base.ranking = [];

  if (scope === 'balcao') {
    var rk = data.rankingBalcao || {};
    base.ranking = (Array.isArray(rk.linhas) ? rk.linhas : [])
      .map(function(row){ return { nome: titleName(row.nome), valor: n(row.realizado) }; })
      .filter(function(row){ return row.nome && row.valor > 0; });
  }
  return base;
}

function montarHtml(scope){
  var molde = MOLDES[scope];
  if (!molde) throw new Error('Molde não encontrado: ' + scope);
  var json = JSON.stringify(montarDados(scope)).replace(/</g, '\\u003c');
  return molde
    .replace('__FONTES__', function(){ return MOLDES.fontes; })
    .replace('__DADOS__', function(){ return json; });
}

function base64ToBlob(b64, tipo){
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: tipo || 'image/png' });
}

function baixar(resp){
  if (!resp || resp.ok !== true || !resp.base64) throw new Error('Resposta PNG inválida.');
  var url = URL.createObjectURL(base64ToBlob(resp.base64, resp.mimeType));
  var a = document.createElement('a');
  a.download = resp.filename || 'resultado-comercial.png';
  a.href = url;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

function estadoBotao(button, ocupado){
  if (!button) return;
  button.disabled = ocupado;
  var rotulo = button.querySelector('.rotulo');
  if (rotulo) rotulo.textContent = ocupado ? 'Gerando...' : 'Salvar PNG';
}

function exportar(scope, button){
  estadoBotao(button, true);
  var html, nome;
  try {
    html = montarHtml(scope);
    var dados = montarDados(scope);
    nome = 'resultado-' + scope + '-' + dados.dataRef.replace(/\//g, '-') + '.png';
  } catch (err) {
    console.error('[ATENDE PNG V2] preparo:', err);
    alert('Não foi possível preparar o PNG: ' + (err && err.message ? err.message : String(err)));
    estadoBotao(button, false);
    return;
  }

  google.script.run
    .withSuccessHandler(function(resp){
      try { baixar(resp); }
      catch (err) {
        console.error('[ATENDE PNG V2] download:', err);
        alert('Não foi possível baixar o PNG: ' + (err && err.message ? err.message : String(err)));
      }
      finally { estadoBotao(button, false); }
    })
    .withFailureHandler(function(err){
      console.error('[ATENDE PNG V2] servidor:', err);
      alert('Não foi possível gerar o PNG: ' + (err && err.message ? err.message : String(err)));
      estadoBotao(button, false);
    })
    .ATENDE_renderCommercialPngV1({ html: html, filename: nome, width: TAMANHO, height: TAMANHO });
}

function tituloComercial(){
  var t = document.querySelector('#dashboardView .v4-title');
  if (!t) return null;
  return clean(t.textContent).toLowerCase().indexOf('comercial') === 0 ? t : null;
}

function mount(){
  var titulo = tituloComercial();
  var atual = document.getElementById(TOOLS_ID);
  if (!titulo) { if (atual) atual.remove(); return; }
  if (atual) return;
  var box = document.createElement('div');
  box.id = TOOLS_ID;
  /* mesma classe do gerador antigo: reaproveita o posicionamento já aprovado no Index */
  box.className = 'commercial-png-tools-v1';
  box.innerHTML =
    '<select id="commercialPngScopeV2" aria-label="Arte do PNG">' +
      '<option value="balcao">Balcão AGF</option>' +
      '<option value="encomendas">Encomendas</option>' +
      '<option value="metro">Metrô</option>' +
    '</select>' +
    '<button type="button" id="commercialPngSaveV2">' +
      '<span class="material-symbols-rounded">download</span><span class="rotulo">Salvar PNG</span>' +
    '</button>';
  titulo.insertAdjacentElement('afterend', box);
  var select = document.getElementById('commercialPngScopeV2');
  var button = document.getElementById('commercialPngSaveV2');
  button.addEventListener('click', function(){ exportar(select.value, button); });
}

function iniciar(){
  var alvo = document.getElementById('dashboardView');
  if (!alvo) { setTimeout(iniciar, 250); return; }
  new MutationObserver(function(){ setTimeout(mount, 0); }).observe(alvo, { childList: true, subtree: true });
  mount();
}

window.ATENDE_exportCommercialPngV2 = function(scope){ exportar(scope || 'balcao', null); };
window.ATENDE_buildCommercialPngHtmlV2 = montarHtml;
iniciar();
})();
</script>
