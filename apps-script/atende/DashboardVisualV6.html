function n(v){v=Number(v||0);return Number.isFinite(v)?v:0}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(v){return'R$ '+n(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

function pct(v,d){return n(v).toLocaleString('pt-BR',{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})+'%'}
function share(v,t){return t?n(v)*100/n(t):0}

function selectedMonthV6(data){
  return String(
    data&&data.dashboardV6Meta&&data.dashboardV6Meta.anchorMonth
      || data&&data.metas&&data.metas.competencia
      || ''
  );
}

function currentMonthV6(){
  var d=new Date();
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0');
}

function periodModeV6(data){
  var selected=selectedMonthV6(data);
  var current=currentMonthV6();

  if(!selected)return 'current';
  if(selected<current)return 'past';
  if(selected>current)return 'future';

  return 'current';
}

function competenceLabelV6(data){
  var v=selectedMonthV6(data);

  if(!/^\d{4}-\d{2}$/.test(v))return '';

  var p=v.split('-');
  var dt=new Date(Number(p[0]),Number(p[1])-1,1);

  return dt.toLocaleDateString(
    'pt-BR',
    {month:'long',year:'numeric'}
  );
}

function findCard(title){
  var cards=document.querySelectorAll('#dashboardView .v4-card');
  for(var i=0;i<cards.length;i++){
    var h=cards[i].querySelector('.v4-head strong');
    if(h&&h.textContent.trim()===title)return cards[i];
  }
  return null;
}

function replaceBody(card,html){
  if(!card)return;
  card.querySelectorAll(':scope > :not(.v4-head)').forEach(function(x){x.remove()});
  card.insertAdjacentHTML('beforeend',html);
}

function adjusted(data,scope){
  var p=data&&data.projecaoReceita;
  if(!p||!p.disponivel)return 0;
  if(scope==='encomendas')return n(p.grupos&&p.grupos.encomendas&&p.grupos.encomendas.projetado);
  if(scope==='mensageria')return n(p.grupos&&p.grupos.mensageria&&p.grupos.mensageria.projetado);
  if(scope==='balcao')return n((p.locais&&p.locais.balcao||{}).projetado);
  if(scope==='metro')return n((p.locais&&p.locais.metro||{}).projetado);
  return 0;
}

function commercialProjectionV6(data,scope){
  if(periodModeV6(data)!=='current')return 0;
  return adjusted(data,scope);
}

function donutCard(title,rows){
  var all=(rows||[]).filter(function(x){return n(x.valor)>0});
  var sum=all.reduce(function(a,x){return a+n(x.valor)},0);
  if(!all.length)return'<section class="v4-card"><div class="v4-head"><strong>'+esc(title)+'</strong><span>valor + participação</span></div><div class="v4-empty">Sem dados.</div></section>';
  all.sort(function(a,b){return n(b.valor)-n(a.valor)});
  var shown=all.slice(0,5),rest=all.slice(5);
  if(rest.length)shown.push({label:'Outros',valor:rest.reduce(function(a,x){return a+n(x.valor)},0)});
  var start=0,parts=[],legend='';
  shown.forEach(function(x,i){
    var p=share(x.valor,sum),end=start+p,c=COLORS[i%COLORS.length];
    parts.push(c+' '+start.toFixed(2)+'% '+end.toFixed(2)+'%');
    legend+='<div class="v6-donut-row"><i style="background:'+c+'"></i><b title="'+esc(x.label)+'">'+esc(x.label)+'</b><strong>'+money(x.valor)+'</strong><em>'+pct(p,1)+'</em></div>';
    start=end;
  });
  return'<section class="v4-card"><div class="v4-head"><strong>'+esc(title)+'</strong><span>valor + participação</span></div><div class="v6-donut-body"><div class="v6-donut" style="background:conic-gradient('+parts.join(',')+')"><div class="v6-donut-center"><div><strong>'+compactMoney(sum)+'</strong><small>Total</small></div></div></div><div class="v6-donut-legend">'+legend+'</div></div></section>';
}

function tierData(prefix,c){
  return MEDALS.map(function(base){
    var key=prefix+base.name.charAt(0).toUpperCase()+base.name.slice(1);
    return{name:base.name,color:base.color,value:n(c[key])};
  });
}
function tierState(actual,tiers){
  var current=null,next=null;
  tiers.forEach(function(t){if(t.value>0&&actual>=t.value)current=t;else if(!next&&t.value>0&&actual<t.value)next=t});
  return{current:current,next:next};
}

function localFilterExcludes(scope){
  if(scope!=='balcao' && scope!=='metro')return false;

  var f={};

  try{
    if(typeof window.filterContext==='function'){
      f=window.filterContext()||{};
    }
  }catch(_){}

  var values=f.locais || [];

  if(!Array.isArray(values)){
    values=values?[values]:[];
  }

  values=values.map(function(v){
    return String(v||'')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .toUpperCase()
      .trim();
  }).filter(Boolean);

  if(!values.length)return false;

  if(scope==='metro'){
    return values.indexOf('METRO')<0;
  }

  return values.indexOf('BALCAO')<0 &&
         values.indexOf('BALCAO AGF')<0;
}

function inlineMedals(data,scope){
  var m=data&&data.metas||{},
      c=m.config||{},
      excluded=localFilterExcludes(scope),
      actual=excluded?0:n(m.realizado&&m.realizado[scope]);

  if(excluded){
    return ''+
      '<div class="v6-inline-medals">'+
        '<div class="v6-inline-medals-title">'+
          '<span>Faixas</span>'+
          '<strong>Fora do filtro</strong>'+
        '</div>'+
        '<div class="v6-goal-excluded">'+
          'Este grupo não participa do recorte atual.'+
        '</div>'+
      '</div>';
  }

  if(!m.disponivel){
    return ''+
      '<div class="v6-inline-medals">'+
        '<div class="v6-inline-medals-title">'+
          '<span>Faixas</span>'+
          '<strong>Sem metas cadastradas</strong>'+
        '</div>'+
      '</div>';
  }

  var tiers=tierData(scope,c),
      st=tierState(actual,tiers),
      lower=st.current?n(st.current.value):0,
      last=tiers[tiers.length-1],
      upper=st.next
        ? n(st.next.value)
        : n(last&&last.value),
      progress=upper>lower
        ? Math.max(
            0,
            Math.min(
              100,
              (actual-lower)*100/(upper-lower)
            )
          )
        : 100;

  return ''+
    '<div class="v6-inline-medals">'+

      '<div class="v6-inline-medals-title">'+
        '<span>Faixas</span>'+
        '<strong>'+
          esc(st.current?st.current.name:'Abaixo da Bronze')+
        '</strong>'+
      '</div>'+

      '<div class="v6-medal-track">'+
        tiers.map(function(t){
          var unlocked=
                t.value>0&&actual>=t.value,

              isCurrent=
                st.current&&
                st.current.name===t.name;

          return ''+
            '<div class="v6-medal '+
              (unlocked?'unlocked ':'')+
              (isCurrent?'current':'')+
              '" style="--medal:'+t.color+'">'+

              '<span class="material-symbols-rounded">'+
                'military_tech'+
              '</span>'+

              '<b>'+esc(t.name)+'</b>'+
              '<small>'+money(t.value)+'</small>'+

              (
                isCurrent
                  ? '<span class="v6-current-label">ATUAL</span>'
                  : ''
              )+

            '</div>';
        }).join('')+
      '</div>'+

      '<div class="v6-medal-progress">'+

        '<span>'+
          (st.current?esc(st.current.name):'Início')+
        '</span>'+

        '<div class="v6-medal-progress-track">'+
          '<i style="width:'+progress+'%"></i>'+
        '</div>'+

        '<span>'+
          (
            st.next
              ? 'Faltam '+
                money(
                  Math.max(
                    0,
                    n(st.next.value)-actual
                  )
                )+
                ' para '+esc(st.next.name)
              : 'Ouro atingido'
          )+
        '</span>'+

      '</div>'+

    '</div>';
}


function commercialGoalCards(data){
  var m=data&&data.metas||{},
      c=m.config||{},
      current=periodModeV6(data)==='current',
      done=n(c.diasUteisRealizados),
      days=n(c.diasUteisMes),
      groups=[
        ['Encomendas','encomendas','#C46A1A'],
        ['Balcão AGF','balcao','#7890A7'],
        ['Metrô','metro','#D8A400']
      ];

  return groups.map(function(g){

    var excluded=localFilterExcludes(g[1]),

        actual=
          excluded
            ? 0
            : n(m.realizado&&m.realizado[g[1]]),

        projection=
          excluded
            ? 0
            : (
                current
                  ? commercialProjectionV6(data,g[1])
                  : 0
              ),

        tiers=tierData(g[1],c),

        state=tierState(actual,tiers),

        projectedState=
          projection
            ? tierState(projection,tiers)
            : {current:null,next:null},

        base=n(tiers[0]&&tiers[0].value),

        progress=
          base
            ? Math.min(100,actual*100/base)
            : 0,

        dailyActual=
          done
            ? actual/done
            : 0,

        dailyExpected=
          days&&base
            ? base/days
            : 0,

        currentLabel=
          excluded
            ? 'Fora do filtro'
            : (
                'Atual: '+
                (
                  state.current
                    ? state.current.name
                    : 'Abaixo da Bronze'
                )
              ),

        projectedLabel=
          excluded
            ? 'Fora do filtro'
            : (
                current
                  ? (
                      projectedState.current
                        ? projectedState.current.name
                        : 'Abaixo da Bronze'
                    )
                  : (
                      periodModeV6(data)==='past'
                        ? 'Mês encerrado'
                        : 'Mês futuro'
                    )
              );

    return ''+

      '<section class="v4-card v4-goal" '+
        'style="--goal:'+g[2]+'">'+

        '<div class="v4-goal-title">'+
          '<strong>'+esc(g[0])+'</strong>'+
          '<span class="v4-badge" '+
            'style="--badge:'+g[2]+';--badge-bg:#F5F8FA">'+
            esc(currentLabel)+
          '</span>'+
        '</div>'+

        '<div class="v4-goal-main">'+
          '<div>'+
            '<div class="v4-goal-value">'+
              money(actual)+
            '</div>'+
            '<div class="v4-note">'+
              'meta Bronze '+
              (
                base
                  ? money(base)
                  : 'não cadastrada'
              )+
            '</div>'+
          '</div>'+
          '<div class="v4-goal-pct">'+
            (
              base
                ? pct(actual*100/base,1)
                : '—'
            )+
          '</div>'+
        '</div>'+

        '<div class="v4-progress">'+
          '<span style="width:'+progress+'%"></span>'+
        '</div>'+

        '<div class="v6-commercial-metrics">'+

          '<div class="v6-commercial-metric daily">'+
            '<span>Média diária realizada</span>'+
            '<strong>'+
              (
                excluded
                  ? money(0)
                  : money(dailyActual)
              )+
            '</strong>'+
          '</div>'+

          '<div class="v6-commercial-metric expected">'+
            '<span>Média diária esperada</span>'+
            '<strong>'+
              (
                base&&days
                  ? money(dailyExpected)
                  : '—'
              )+
            '</strong>'+
          '</div>'+

          '<div class="v6-commercial-metric projection">'+
            '<span>Projeção V6</span>'+
            '<strong>'+
              (
                current
                  ? money(projection)
                  : '—'
              )+
            '</strong>'+
          '</div>'+

          '<div class="v6-commercial-metric">'+
            '<span>Faixa projetada</span>'+
            '<strong>'+
              esc(projectedLabel)+
            '</strong>'+
          '</div>'+

        '</div>'+

        inlineMedals(data,g[1])+

      '</section>';

  }).join('');
}

function medalMapBody(data){

      c=m.config||{},

      comp=competenceLabelV6(data),
      groups=[
        ['Encomendas','encomendas'],
        ['Balcão AGF','balcao'],
        ['Metrô','metro']

  groups.forEach(function(g){

    var actual=n(m.realizado&&m.realizado[g[1]]);
    var excluded=localFilterExcludes(g[1]);

    if(excluded){
      html+=
        '<div class="v6-medal-group">'+
          '<div class="v6-medal-group-top">'+
            '<div>'+
              '<strong>'+esc(g[0])+'</strong>'+
              '<small>Realizado '+money(0)+'</small>'+
            '</div>'+
            '<span class="v6-medal-current">Fora do filtro</span>'+
          '</div>'+
          '<div class="v6-visual-note">'+
            'O filtro de Local atual exclui este grupo.'+
          '</div>'+
        '</div>';
      return;
    }
    if(!m.disponivel){

      html+=
        '<div class="v6-medal-group">'+
          '<div class="v6-medal-group-top">'+
            '<div>'+
              '<strong>'+esc(g[0])+'</strong>'+
              '<small>Realizado '+money(actual)+'</small>'+
            '</div>'+
            '<span class="v6-medal-current">'+
              'Sem meta histórica'+
            '</span>'+
          '</div>'+
          '<div class="v6-visual-note">'+
            'As metas de '+esc(comp||'esta competência')+
            ' não estão cadastradas. '+
            'Nenhuma medalha foi inferida.'+
          '</div>'+
        '</div>';

      return;
    }

    var projection=mode==='current'?commercialProjectionV6(data,g[1]):0,

        tiers=tierData(g[1],c),
        st=tierState(actual,tiers),
        pst=
          projection
            ? tierState(projection,tiers)
            : {current:null,next:null},

        lower=
          st.current
            ? n(st.current.value)
            : 0,

        upper=
          st.next
            ? n(st.next.value)
            : n(tiers[3]&&tiers[3].value),

        progress=
          upper>lower
            ? Math.max(
                0,
                Math.min(
                  100,
                  (actual-lower)*100/(upper-lower)
                )
              )
            : 100;

    var subtitle=
      mode==='current'
        ? 'Realizado '+money(actual)+
          ' · projeção '+(projection?money(projection):'—')
        : mode==='past'
          ? 'Resultado final '+money(actual)
          : 'Realizado '+money(actual)+' · mês futuro';

    html+=
      '<div class="v6-medal-group">'+

        '<div class="v6-medal-group-top">'+

          '<div>'+
            '<strong>'+esc(g[0])+'</strong>'+
            '<small>'+subtitle+'</small>'+
          '</div>'+

          '<span class="v6-medal-current">'+
            esc(
              st.current
                ? st.current.name
                : 'Abaixo da Bronze'
            )+
          '</span>'+
        '</div>';

    html+=
      '<div class="v6-medal-track">'+

      tiers.map(function(t){

        var unlocked=
              t.value>0&&actual>=t.value,

            current=
              st.current&&
              st.current.name===t.name;

        return(
          '<div class="v6-medal '+
            (unlocked?'unlocked ':'')+
            (current?'current':'')+
            '" style="--medal:'+t.color+'" '+
            'title="'+
              esc(
                t.name+
                ' · a partir de '+
                money(t.value)
              )+
            '">'+

            '<span class="material-symbols-rounded">'+
              'military_tech'+
            '</span>'+

            '<b>'+esc(t.name)+'</b>'+
            '<small>'+money(t.value)+'</small>'+

            (
              current
                ? '<span class="v6-current-label">'+
                    (mode==='current'?'ATUAL':'FINAL')+
                  '</span>'
                : ''
            )+

          '</div>'
        );

      }).join('')+

      '</div>';

    html+=
      '<div class="v6-medal-progress">'+

        '<span>'+
          (st.current?st.current.name:'Início')+
        '</span>'+

        '<div class="v6-medal-progress-track">'+
          '<i style="width:'+progress+'%"></i>'+
        '</div>'+

        '<span>'+
          (
            st.next
              ? 'Faltam '+
                money(
                  Math.max(
                    0,
                    st.next.value-actual
                  )
                )+
                ' para '+st.next.name
              : 'Ouro atingido'
          )+
        '</span>'+
      '</div>';

    if(mode==='current'){

      html+=
        '<div class="v6-visual-note">'+
          'Projeção V6: <strong>'+
            (
              projection
                ? (
                    pst.current
                      ? pst.current.name
                      : 'abaixo da Bronze'
                  )
                : '—'
            )+
          '</strong>. Metas da competência '+esc(comp)+'.'+
        '</div>';

    }else if(mode==='past'){

      html+=
        '<div class="v6-visual-note">'+
          '<strong>Mês encerrado.</strong> '+
          'Sem projeção. Medalha calculada pelas metas '+
          'cadastradas para '+esc(comp)+'.'+
        '</div>';

    }else{

      html+=
        '<div class="v6-visual-note">'+
          'Mês futuro. Sem projeção.'+
        '</div>';
    }

    html+='</div>';
  });

  return html+'</div>';
}


function goalCompareBody(data){

  var m=data&&data.metas||{},
      c=m.config||{},
      mode=periodModeV6(data),
      comp=competenceLabelV6(data);

  if(!m.disponivel){

    return(
      '<div class="v6-visual-note">'+
        'Metas de '+esc(comp||'esta competência')+
        ' não cadastradas. Comparativo suspenso.'+
      '</div>'
    );
  }

  var items=[
    [
      'Encomendas',
      'encomendas',
      n(m.realizado&&m.realizado.encomendas),
      n(c.encomendasBronze)
    ],
    [
      'Balcão AGF',
      'balcao',
      n(m.realizado&&m.realizado.balcao),
      n(c.balcaoBronze)
    ],
    [
      'Metrô',
      'metro',
      n(m.realizado&&m.realizado.metro),
      n(c.metroBronze)
    ]
  ];

  var html='<div class="v6-goal-compare">';

  items.forEach(function(x){

    var excluded=localFilterExcludes(x[1]);

    if(excluded){

      html+=
        '<div class="v6-goal-row is-excluded">'+
          '<div class="v6-goal-top">'+
            '<strong>'+esc(x[0])+'</strong>'+
            '<span><b>Fora do filtro</b></span>'+
          '</div>'+
          '<div class="v6-goal-excluded">'+
            'O filtro de Local atual exclui este grupo.'+
          '</div>'+
        '</div>';

      return;
    }

    var current=mode==='current',

        pr=current
          ? commercialProjectionV6(data,x[1])
          : 0,

        scale=
          Math.max(
            x[2],
            x[3],
            pr,
            1
          )*1.06,

        pa=
          x[3]
            ? x[2]*100/x[3]
            : 0,

        pp=
          current&&x[3]
            ? pr*100/x[3]
            : 0,

        aw=
          Math.min(
            100,
            x[2]*100/scale
          ),

        pw=
          current
            ? Math.min(
                100,
                pr*100/scale
              )
            : 0,

        tw=
          Math.min(
            100,
            x[3]*100/scale
          );

    html+=

      '<div class="v6-goal-row">'+

        '<div class="v6-goal-top">'+

          '<strong>'+
            esc(x[0])+
          '</strong>'+

          '<span>'+
            'Realizado <b>'+
              pct(pa,1)+
            '</b> da meta'+
          '</span>'+

          (
            current
              ? '<span>'+
                  'Projeção <b>'+
                    pct(pp,1)+
                  '</b>'+
                '</span>'
              : '<span><b>Mês encerrado</b></span>'
          )+

        '</div>'+

        '<div class="v6-goal-bars">'+

          '<div class="v6-goal-track" '+
            'style="--actual:'+aw+'%;'+
                   '--proj:'+pw+'%;'+
                   '--target:'+tw+'%">'+

            (
              current
                ? '<span class="proj"></span>'
                : ''
            )+

            '<span class="actual"></span>'+

            '<i class="target" title="Meta: '+
              esc(money(x[3]))+
            '"></i>'+

          '</div>'+

        '</div>'+

        '<div class="v6-goal-legend" '+
          (
            current
              ? ''
              : 'style="grid-template-columns:repeat(2,1fr)"'
          )+
        '>'+

          '<div class="v6-goal-stat real">'+
            '<span>Realizado · '+pct(pa,1)+'</span>'+
            '<strong>'+money(x[2])+'</strong>'+
          '</div>'+

          '<div class="v6-goal-stat meta">'+
            '<span>Meta · 100%</span>'+
            '<strong>'+money(x[3])+'</strong>'+
          '</div>'+

          (
            current
              ? '<div class="v6-goal-stat proj">'+
                  '<span>Projeção · '+pct(pp,1)+'</span>'+
                  '<strong>'+
                    (
                      pr
                        ? money(pr)
                        : '—'
                    )+
                  '</strong>'+
                '</div>'
              : ''
          )+

        '</div>'+

      '</div>';
  });

  html+='</div>';

  html+=
    '<div class="v6-visual-note">'+
      (
        mode==='current'
          ? 'Azul = realizado · verde-claro = projeção ajustada · amarelo = meta.'
          : 'Competência '+esc(comp)+
            ': resultado final e meta histórica. Sem projeção.'
      )+
    '</div>';

  return html;
}


function balcaoRankingCard(data){
  var r=data&&data.rankingBalcao||{};

  if(r.suspensoPorFiltroAtendente){
    return ''+
      '<section class="v4-card v6-balcao-ranking-card">'+
        '<div class="v4-head">'+
          '<strong>Ranking por atendente - Balcão</strong>'+
          '<span>atribuição comercial do período</span>'+
        '</div>'+
        '<div class="v6-ranking-warn">'+
          'O ranking fica suspenso quando o filtro de Atendente está ativo. '+
          'ELEN é identificada pelo atendente real; ALESSON e LEVY são atribuídos pela escala semanal, então o filtro operacional poderia distorcer o resultado.'+
        '</div>'+
      '</section>';
  }

  if(r.erro){
    return ''+
      '<section class="v4-card v6-balcao-ranking-card">'+
        '<div class="v4-head">'+
          '<strong>Ranking por atendente - Balcão</strong>'+
          '<span>atribuição comercial do período</span>'+
        '</div>'+
        '<div class="v6-ranking-warn">Não foi possível calcular o ranking: '+esc(r.erro)+'</div>'+
      '</section>';
  }

  var total=n(r.totalBalcao),rows=r.linhas||[];

  if(!total){
    return ''+
      '<section class="v4-card v6-balcao-ranking-card">'+
        '<div class="v4-head">'+
          '<strong>Ranking por atendente - Balcão</strong>'+
          '<span>atribuição comercial do período</span>'+
        '</div>'+
        '<div class="v4-empty">Sem faturamento de Balcão neste recorte.</div>'+
      '</section>';
  }

  var body=rows.map(function(x){
    var sharePct=n(x.percentualDoBalcao);
    return ''+
      '<tr>'+
        '<td><span class="v6-ranking-pos">'+esc(String(x.posicao||''))+'º</span></td>'+
        '<td><span class="v6-ranking-name">'+esc(x.nome||'')+'</span></td>'+
        '<td class="num"><strong>'+money(x.realizado)+'</strong></td>'+
        '<td>'+
          '<div class="v6-ranking-share">'+
            '<div class="v6-ranking-share-track"><i style="width:'+Math.max(0,Math.min(100,sharePct))+'%"></i></div>'+
            '<strong>'+pct(sharePct,2)+'</strong>'+
          '</div>'+
        '</td>'+
      '</tr>';
  }).join('');

  var warning='';

  if(!r.escalaCompleta){
    var dates=(r.datasSemEscala||[]).slice(0,6).map(function(v){
      var p=String(v||'').split('-');
      return p.length===3?p[2]+'/'+p[1]:String(v||'');
    });

    warning=''+
      '<div class="v6-ranking-warn">'+
        '<strong>Atribuição incompleta.</strong> '+
        money(r.naoAtribuido)+' do Balcão ainda não tem responsável semanal'+
        (dates.length?' nas datas '+esc(dates.join(', '))+'.':'.')+
      '</div>';
  }

  var painel=n(data&&data.metas&&data.metas.realizado&&data.metas.realizado.balcao);
  var difference=Math.abs(total-painel);

  if(!localFilterExcludes('balcao')&&painel&&difference>0.05){
    warning+=''+
      '<div class="v6-ranking-warn">'+
        '<strong>Conferência:</strong> total do ranking '+money(total)+
        ' difere do card Balcão '+money(painel)+'. Não usar o ranking até revisar o recorte.'+
      '</div>';
  }

  return ''+
    '<section class="v4-card v6-balcao-ranking-card">'+
      '<div class="v4-head">'+
        '<strong>Ranking por atendente - Balcão</strong>'+
        '<span>ELEN pelo atendente · ALESSON/LEVY pela escala semanal</span>'+
      '</div>'+

      '<div class="v6-ranking-summary">'+
        '<div><span>Total do Balcão</span><strong>'+money(total)+'</strong></div>'+
        '<div><span>Atribuído</span><strong>'+pct(r.percentualAtribuido,2)+'</strong></div>'+
        '<div><span>Sem responsável</span><strong>'+money(r.naoAtribuido)+'</strong></div>'+
      '</div>'+

      '<div class="v6-ranking-table-wrap">'+
        '<table class="v6-ranking-table">'+
          '<thead><tr>'+
            '<th>Posição</th>'+
            '<th>Colaborador</th>'+
            '<th class="num">Realizado</th>'+
            '<th>% do Balcão</th>'+
          '</tr></thead>'+
          '<tbody>'+body+'</tbody>'+
        '</table>'+
      '</div>'+

      warning+
      '<div class="v6-ranking-note">'+
        'A receita do Balcão continua sendo definida pela classificação de LOCAL já existente. '+
        'O ranking apenas redistribui internamente esse total entre ELEN, ALESSON e LEVY.'+
      '</div>'+
    '</section>';
}

function patch(data){
  var active=document.querySelector('#viewSwitchRow button.active'),view=active&&active.dataset?active.dataset.view:'';
  var shell=document.querySelector('#dashboardView .v4-shell');
  if(!shell||view==='table')return;
  var signature=CACHE_KEY+'|'+view;
  if(shell.dataset.v6VisualSig===signature)return;
  shell.dataset.v6VisualSig=signature;

  if(view==='operacao'||(view==='gestao'&&canManage())){
    var donuts=document.querySelector('#dashboardView .v4-donuts');
    if(donuts)donuts.innerHTML=donutCard('Faturamento por Local',data.localGlobal||data.local||[])+donutCard('Mix por Tipo de Serviço',data.tipoServico||[])+donutCard('Canal',data.canais||data.intermediadores||[]);
  }
  if(view==='comercial'){

    var goals=
      document.querySelector(
        '#dashboardView .v4-goals'
      );

    if(goals){

      var oldGrid=
        goals.nextElementSibling;

      var html=
        '<div class="v6-commercial-main">'+

          '<div class="v6-commercial-cards">'+
            commercialGoalCards(data)+
          '</div>'+

          '<section class="v4-card v6-commercial-compare-card">'+

            '<div class="v4-head">'+
              '<strong>Realizado x meta x projeção</strong>'+
              '<span>por grupo</span>'+
            '</div>'+

            goalCompareBody(data)+

          '</section>'+

          '<div class="v6-balcao-ranking-wrap">'+
            balcaoRankingCard(data)+
          '</div>'+

        '</div>';

      goals.insertAdjacentHTML(
        'beforebegin',
        html
      );

      goals.remove();

      if(
        oldGrid&&
        oldGrid.classList&&
        oldGrid.classList.contains('v4-grid2')
      ){
        oldGrid.remove();
      }
    }
  }
}

function key(){try{return JSON.stringify(window.filterContext?filterContext():{})}catch(_){return''}}
function fetchAndPatch(){
  var k=key();
  if(CACHE&&CACHE_KEY===k){patch(CACHE);return}
  if(BUSY)return;
  BUSY=true;
  google.script.run.withSuccessHandler(function(r){BUSY=false;if(!r||!r.ok)return;CACHE=r;CACHE_KEY=k;patch(r)}).withFailureHandler(function(){BUSY=false}).ATENDE_buscarDashboardV4D1(window.filterContext?filterContext():{},window.AUTH_TOKEN||'');
}
function schedule(){clearTimeout(TIMER);TIMER=setTimeout(function(){var a=document.querySelector('#viewSwitchRow button.active');if(a&&a.dataset.view!=='table')fetchAndPatch()},180)}
function boot(){
  css();
  var d=document.getElementById('dashboardView');
  if(!d){setTimeout(boot,200);return}
  new MutationObserver(schedule).observe(d,{childList:true,subtree:true});
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('#viewSwitchRow button[data-view]');
    if(b)setTimeout(schedule,200);

    var weekly=e.target.closest&&e.target.closest('#dbWeeklySave');
    if(weekly){
      CACHE=null;
      CACHE_KEY='';
    }
  });
  schedule();
  window.ATENDE_DASHBOARD_VISUAL_V6_READY=true;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
