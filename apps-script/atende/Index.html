<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atendimento - AGF José Bonifácio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<style>
:root{--nv:#00416B;--nv2:#00355A;--yl:#FFD400;--bg:#F4F7FA;--card:#fff;--line:#E2E8F0;--line2:#CBD5E1;--text:#253347;--muted:#6B7B8F;--ff:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--ff);background:var(--bg);color:var(--text);font-size:12px;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:56px 1fr}.topbar{background:#fff;border-bottom:1px solid rgba(0,65,107,.1);display:flex;align-items:center;padding:0 14px;gap:10px;box-shadow:0 3px 14px rgba(0,65,107,.045);z-index:4}.brand{display:flex;align-items:center;gap:10px}.brand-ico{width:38px;height:38px;border:1px solid #d8e7f1;border-radius:12px;display:grid;place-items:center;color:#0077b6;background:#f6fbfe}.material-symbols-rounded{font-family:'Material Symbols Rounded';font-size:19px;line-height:1}.brand h1{font-size:14px;margin:0;color:#14324a;font-weight:900}.brand p{margin:2px 0 0;color:var(--muted);font-size:10px}.actions{margin-left:auto;display:flex;gap:7px;align-items:center}.pill{background:var(--yl);color:var(--nv);border-radius:999px;padding:5px 10px;font-weight:900;font-size:10px}.btn{border:1px solid var(--line2);border-radius:8px;min-height:30px;padding:0 9px;background:#fff;color:var(--nv);font:inherit;font-size:10px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}.btn:hover{background:#eef5fa}.btn:disabled{opacity:.4;cursor:not-allowed}
.content{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr;gap:7px;padding:8px}.filters-bar{background:#fff;border:1px solid rgba(0,65,107,.12);border-radius:11px;padding:6px 7px;overflow-x:auto;box-shadow:0 2px 8px rgba(15,23,42,.035)}.filter-row{display:grid;grid-template-columns:minmax(145px,1.6fr) 106px 106px 82px 100px 108px 66px 114px 132px 124px 84px;gap:5px;align-items:end;min-width:1200px}.filter-field{min-width:0}.filter-field label{display:block;font-size:8px;font-weight:900;color:var(--nv);text-transform:uppercase;letter-spacing:.18px;margin:0 0 3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filter-field input,.filter-field select{width:100%;height:29px;border:1px solid var(--line2);border-radius:7px;padding:0 6px;background:#fff;color:var(--text);font:inherit;font-size:10px;outline:none;min-width:0}.filter-field input:focus,.filter-field select:focus{border-color:var(--nv);box-shadow:0 0 0 2px rgba(0,65,107,.09)}.filter-clear{height:29px;width:100%;padding:0 7px}.filter-clear .material-symbols-rounded{font-size:16px}
.card{min-height:0;background:#fff;border:1px solid rgba(0,65,107,.1);border-radius:12px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 3px 12px rgba(15,23,42,.07)}.table-top{min-height:42px;padding:6px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.table-top strong{color:var(--nv)}.muted{color:var(--muted);font-size:9.5px}.total-value{margin-left:auto;text-align:right}.total-value span{display:block;font-size:8.5px;color:var(--muted);font-weight:800;text-transform:uppercase}.total-value strong{font-size:15px;color:#B45309}.wrap{min-height:0;overflow:auto;position:relative}.data-table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:1px;min-width:0;font-size:11px}.data-table thead{position:sticky;top:0;z-index:2}.data-table th{background:var(--nv);color:#fff;font-weight:900;text-align:left;border-right:1px solid rgba(255,255,255,.1);border-bottom:1px solid var(--nv2);padding:0;white-space:nowrap;position:relative;min-width:0}.th-main{height:32px;display:flex;align-items:center;gap:4px;padding:0 8px;cursor:pointer;user-select:none;min-width:0}.th-main:hover{background:rgba(255,255,255,.09)}.th-label{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.sort-icon{font-size:9px;color:rgba(255,255,255,.68);flex:0 0 auto}.sort-active{color:var(--yl)}.data-table td{min-width:0;border-bottom:1px solid #E5EAF1;border-right:1px solid #EEF2F7;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}.data-table tbody tr:nth-child(even) td{background:#F8FAFC}.data-table tbody tr:hover td{background:#FFFBEA}.data-table td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#475569}.data-table td.num{text-align:right;font-variant-numeric:tabular-nums}.resizer{position:absolute;right:-3px;top:0;width:8px;height:100%;cursor:col-resize;z-index:3}.resizer:hover,.resizer.dragging{background:rgba(255,212,0,.55)}body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}.footer{min-height:38px;padding:5px 9px;border-top:1px solid var(--line);background:#fbfdff;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px}.pager{margin-left:auto;display:flex;align-items:center;gap:5px}.pager label{display:flex;align-items:center;gap:4px;font-weight:700}.pager select{height:27px;border:1px solid var(--line2);border-radius:7px;background:#fff}.pager .btn{min-height:27px;width:29px;padding:0}.empty{display:none;min-height:220px;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.empty.on{display:flex}.empty strong{display:block;color:var(--nv);font-size:15px}.ov{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:99}.ov.on{display:flex}.spinbox{background:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--nv);box-shadow:0 15px 30px rgba(16,24,40,.18)}.spin{width:22px;height:22px;border:3px solid rgba(0,65,107,.14);border-top-color:var(--nv);border-radius:50%;animation:sp .75s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100%}.content{min-height:calc(100vh - 56px)}.card{height:72vh}.footer{flex-wrap:wrap}.pager{margin-left:0}.desktop{display:none}}
</style>
</head>
<body>
<div class="ov" id="ov"><div class="spinbox"><div class="spin"></div><span>Carregando dados...</span></div></div>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-ico"><span class="material-symbols-rounded" data-agf-icon="atendimento">support_agent</span></div><div><h1>Atendimento</h1><p>AGF José Bonifácio</p></div></div>
  <div class="actions"><span class="pill" id="badge">0 registros</span><button class="btn" onclick="loadPage(PAGE)"><span class="material-symbols-rounded" data-agf-icon="refresh">refresh</span><span class="desktop">Atualizar</span></button></div>
</header>
<main class="content">
  <section class="filters-bar" aria-label="Filtros do painel">
    <div class="filter-row">
      <div class="filter-field"><label>Busca</label><input id="q" placeholder="SRO, remetente, CEP, contrato..." oninput="scheduleSearch()"></div>
      <div class="filter-field"><label>Data início</label><input id="dataInicio" type="date" onchange="applyFilters()"></div>
      <div class="filter-field"><label>Data fim</label><input id="dataFim" type="date" onchange="applyFilters()"></div>
      <div class="filter-field"><label>Serviço</label><select id="servico" onchange="applyFilters()"><option value="">Todos</option></select></div>
      <div class="filter-field"><label>Contrato</label><select id="contrato" onchange="applyFilters()"><option value="">Todos</option></select></div>
      <div class="filter-field"><label>Sistema</label><select id="sistema" onchange="applyFilters()"><option value="">Todos</option></select></div>
      <div class="filter-field"><label>Estorno</label><select id="estorno" onchange="applyFilters()"><option value="">Todos</option></select></div>
      <div class="filter-field"><label>Atendente</label><select id="atendente" onchange="applyFilters()"><option value="">Todos</option></select></div>
      <div class="filter-field"><label>Modalidade pagamento</label><select id="modalidadePagamento" onchange="applyFilters()"><option value="">Todos</option></select></div>
      <div class="filter-field"><label>Forma pagamento</label><select id="formaPagamento" onchange="applyFilters()"><option value="">Todos</option></select></div>
      <div class="filter-field"><label>&nbsp;</label><button class="btn filter-clear" onclick="clearFilters()"><span class="material-symbols-rounded">filter_alt_off</span>Limpar</button></div>
    </div>
  </section>

  <section class="card">
    <div class="table-top"><div><strong id="info">Carregando...</strong><div class="muted" id="hint">Clique no cabeçalho para ordenar. Primeiro clique: maior para menor.</div></div><div class="total-value"><span>Valor das postagens</span><strong id="totalValue">R$ 0,00</strong></div></div>
    <div class="wrap" id="wrap"><div class="empty" id="empty"><div><strong>Nenhum registro encontrado</strong><p>Ajuste os filtros.</p></div></div><table class="data-table" id="table" style="display:none"><colgroup id="cols"></colgroup><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="footer"><span id="pageInfo">-</span><div class="pager"><label>Linhas <select id="pageSize" onchange="changePageSize()"><option>50</option><option selected>100</option><option>200</option></select></label><button class="btn" id="first" onclick="go(1)">«</button><button class="btn" id="prev" onclick="go(PAGE-1)">‹</button><span id="pageNumber">1 / 1</span><button class="btn" id="next" onclick="go(PAGE+1)">›</button><button class="btn" id="last" onclick="go(PAGES)">»</button></div></div>
  </section>
</main>
</div>
<script>
function loadSavedWidths(){try{return JSON.parse(localStorage.getItem('atende:d1:columnWidths')||'{}')||{}}catch(e){return{}}}
function saveWidths(){try{localStorage.setItem('atende:d1:columnWidths',JSON.stringify(WIDTHS))}catch(e){}}
var PAGE=1,PAGE_SIZE=100,PAGES=1,TOTAL=0,TOTAL_VALUE=0,COLS=[],ROWS=[],TIMER=null,WIDTHS=loadSavedWidths(),SORT_KEY='DATA',SORT_DIR='desc';
window.onload=function(){loadFilterOptions();loadPage(1)};
function getValue(id){var el=document.getElementById(id);return el?el.value:''}
function params(page){return{page:page||1,pageSize:PAGE_SIZE,q:getValue('q').trim(),dataInicio:getValue('dataInicio'),dataFim:getValue('dataFim'),servico:getValue('servico'),contrato:getValue('contrato'),sistema:getValue('sistema'),estorno:getValue('estorno'),atendente:getValue('atendente'),modalidadePagamento:getValue('modalidadePagamento'),formaPagamento:getValue('formaPagamento'),sortKey:SORT_KEY,sortDir:SORT_DIR}}
function loadPage(page){spin(true);google.script.run.withSuccessHandler(function(r){spin(false);if(!r||!r.ok){alert((r&&r.error)||'Erro ao carregar');return}render(r)}).withFailureHandler(function(e){spin(false);alert(e.message||e)}).ATENDE_buscarDadosD1(params(page));}
function loadFilterOptions(){google.script.run.withSuccessHandler(function(r){if(!r||!r.ok)return;fillSelect('servico',r.servicos);fillSelect('contrato',r.contratos);fillSelect('sistema',r.sistemas);fillSelect('estorno',r.estornos);fillSelect('atendente',r.atendentes);fillSelect('modalidadePagamento',r.modalidadesPagamento);fillSelect('formaPagamento',r.formasPagamento)}).ATENDE_buscarFiltrosD1()}
function fillSelect(id,values){var el=document.getElementById(id),current=el.value;el.innerHTML='<option value="">Todos</option>'+(values||[]).map(function(v){return'<option value="'+esc(v)+'">'+esc(v)+'</option>'}).join('');if(Array.from(el.options).some(function(o){return o.value===current}))el.value=current}
function render(r){PAGE=Number(r.page||1);PAGE_SIZE=Number(r.pageSize||100);PAGES=Number(r.pages||1);TOTAL=Number(r.total||0);TOTAL_VALUE=Number(r.totalValue||0);SORT_KEY=r.sortKey||SORT_KEY;SORT_DIR=r.sortDir||SORT_DIR;COLS=r.columns||[];ROWS=r.rows||[];document.getElementById('pageSize').value=String(PAGE_SIZE);document.getElementById('badge').textContent=TOTAL.toLocaleString('pt-BR')+' registros';document.getElementById('info').textContent=TOTAL.toLocaleString('pt-BR')+' registros encontrados';document.getElementById('totalValue').textContent='R$ '+TOTAL_VALUE.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});buildHead();buildBody();renderPager();}
function buildHead(){document.getElementById('cols').innerHTML=COLS.map(function(c){return'<col style="width:'+(WIDTHS[c.key]||c.width||130)+'px">'}).join('');document.getElementById('thead').innerHTML='<tr>'+COLS.map(function(c,i){var active=SORT_KEY===c.key,icon=active?(SORT_DIR==='desc'?'▼':'▲'):'↕';return'<th data-i="'+i+'" title="Ordenar por '+esc(c.label)+'"><div class="th-main sort-head" data-key="'+esc(c.key)+'"><span class="th-label">'+esc(c.label)+'</span><span class="sort-icon '+(active?'sort-active':'')+'">'+icon+'</span></div><div class="resizer" data-i="'+i+'"></div></th>'}).join('')+'</tr>';document.querySelectorAll('.sort-head').forEach(function(el){el.onclick=function(){sortBy(this.dataset.key)}});bindResize();applyTableWidth();}
function sortBy(key){if(SORT_KEY===key){SORT_DIR=SORT_DIR==='desc'?'asc':'desc'}else{SORT_KEY=key;SORT_DIR='desc'}loadPage(1)}
function buildBody(){var table=document.getElementById('table'),empty=document.getElementById('empty');if(!ROWS.length){table.style.display='none';empty.classList.add('on');return}empty.classList.remove('on');table.style.display='';document.getElementById('tbody').innerHTML=ROWS.map(function(r){return'<tr>'+COLS.map(function(c){var raw=r[c.key];var cls=(c.mono?'mono ':'')+(c.numeric?'num':'');return'<td class="'+cls+'" title="'+esc(raw==null?'':raw)+'">'+(raw===''||raw==null?'<span style="color:#CBD5E1">-</span>':esc(raw))+'</td>'}).join('')+'</tr>'}).join('');}
function renderPager(){var start=TOTAL?(PAGE-1)*PAGE_SIZE+1:0,end=Math.min(PAGE*PAGE_SIZE,TOTAL);document.getElementById('pageInfo').textContent='Exibindo '+start+'-'+end+' de '+TOTAL.toLocaleString('pt-BR');document.getElementById('pageNumber').textContent=PAGE+' / '+PAGES;disable('first',PAGE<=1);disable('prev',PAGE<=1);disable('next',PAGE>=PAGES);disable('last',PAGE>=PAGES);document.getElementById('wrap').scrollTop=0;}
function go(p){p=Math.max(1,Math.min(PAGES,Number(p)||1));if(p!==PAGE)loadPage(p)}
function changePageSize(){PAGE_SIZE=Number(document.getElementById('pageSize').value)||100;loadPage(1)}
function scheduleSearch(){clearTimeout(TIMER);TIMER=setTimeout(function(){loadPage(1)},350)}
function applyFilters(){var ini=getValue('dataInicio'),fim=getValue('dataFim');if(ini&&fim&&ini>fim){alert('A data inicial não pode ser maior que a data final.');return}loadPage(1)}
function clearFilters(){['q','dataInicio','dataFim','servico','contrato','sistema','estorno','atendente','modalidadePagamento','formaPagamento'].forEach(function(id){var el=document.getElementById(id);if(el)el.value=''});loadPage(1)}
function spin(on){document.getElementById('ov').classList.toggle('on',!!on)}function disable(id,v){document.getElementById(id).disabled=!!v}function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function applyTableWidth(){var total=Array.from(document.querySelectorAll('#cols col')).reduce(function(sum,col){return sum+(parseFloat(col.style.width)||0)},0),table=document.getElementById('table');table.style.width=Math.max(1,total)+'px';table.style.minWidth=Math.max(1,total)+'px'}
var RS=null;function bindResize(){document.querySelectorAll('.resizer').forEach(function(x){x.onclick=function(e){e.stopPropagation()};x.onmousedown=function(e){e.preventDefault();e.stopPropagation();var i=Number(this.dataset.i),col=document.querySelectorAll('#cols col')[i],w=parseFloat(col.style.width)||130;RS={i:i,key:COLS[i].key,x:e.clientX,w:w,col:col,handle:this};this.classList.add('dragging');document.body.classList.add('resizing');document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)}})}function move(e){if(!RS)return;var w=Math.max(24,RS.w+e.clientX-RS.x);RS.col.style.width=w+'px';WIDTHS[RS.key]=w;applyTableWidth()}function up(){if(RS&&RS.handle)RS.handle.classList.remove('dragging');document.body.classList.remove('resizing');saveWidths();RS=null;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)}
</script>
<script>(function(){var current={};function apply(n){if(!n||!n.getAttribute)return;var k=n.getAttribute('data-agf-icon');if(!k)return;var i=current.icons||{},c=current.colors||{};if(i[k])n.textContent=i[k];if(c[k])n.style.color=c[k]}function cfg(x){current=x||{};document.querySelectorAll('[data-agf-icon]').forEach(apply)}window.addEventListener('message',function(e){var d=e.data||{};if(d.type==='agf:ui-config')cfg(d.config)});try{window.parent.postMessage({type:'agf:ui-ready'},'*')}catch(e){}})();</script>
</body>
</html>
