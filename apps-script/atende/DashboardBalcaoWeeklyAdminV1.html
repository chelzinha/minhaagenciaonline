<script id="atende-balcao-weekly-admin-v1">
(function(){
'use strict';

function authToken(){
  try{
    if(
      typeof AUTH_TOKEN !== 'undefined' &&
      AUTH_TOKEN
    ){
      return String(AUTH_TOKEN);
    }
  }catch(_){}

  return String(
    window.AUTH_TOKEN || ''
  );
}

function status(text,cls){
  var el=
    document.getElementById(
      'dbWeeklyStatus'
    );

  if(!el)return;

  el.textContent=text||'';
  el.className=
    'status '+(cls||'');
}

function dateBR(value){
  var p=
    String(value||'')
      .split('-');

  if(p.length!==3){
    return String(value||'');
  }

  return p[2]+'/'+p[1];
}

function options(value){
  value=
    String(value||'')
      .toUpperCase();

  return ''+
    '<option value="">Selecione</option>'+
    '<option value="ALESSON"'+
      (value==='ALESSON'?' selected':'')+
      '>Alesson</option>'+
    '<option value="LEVY"'+
      (value==='LEVY'?' selected':'')+
      '>Levy</option>';
}

function render(data){
  var box=
    document.getElementById(
      'dbWeeklyRows'
    );

  if(!box)return;

  var rows=
    data&&data.semanas||[];

  if(!rows.length){
    box.innerHTML=
      '<div class="db-weekly-empty">'+
        'Nenhuma semana útil encontrada.'+
      '</div>';

    return;
  }

  box.innerHTML=
    rows.map(function(x){

      return ''+
        '<div class="db-weekly-row" '+
          'data-inicio="'+
            String(x.inicio||'')+
          '" '+
          'data-fim="'+
            String(x.fim||'')+
          '">'+

          '<div class="db-weekly-period">'+
            '<strong>'+
              'Semana '+
              Number(x.numero||0)+
            '</strong>'+
            '<span>'+
              dateBR(x.inicio)+
              ' a '+
              dateBR(x.fim)+
            '</span>'+
          '</div>'+

          '<select class="db-weekly-owner">'+
            options(x.responsavel)+
          '</select>'+
        '</div>';

    }).join('');
}

function loadWeekly(){
  var mes=
    document.getElementById(
      'dbMetaMes'
    );

  if(
    !mes ||
    !mes.value
  ){
    return;
  }

  var auth=
    authToken();

  if(!auth){
    status(
      'Sessão administrativa não encontrada.',
      'err'
    );
    return;
  }

  status(
    'Carregando...',
    ''
  );

  google.script.run
    .withSuccessHandler(function(r){

      render(r||{});

      status(
        r&&r.complete
          ? 'Escala salva.'
          : 'Defina os responsáveis.',
        r&&r.complete
          ? 'ok'
          : 'warn'
      );

    })
    .withFailureHandler(function(e){

      status(
        e&&e.message
          ? e.message
          : String(e),
        'err'
      );

    })
    .ATENDE_adminBuscarEscalaBalcao(
      auth,
      mes.value
    );
}

function generate(){
  var first=
    document.getElementById(
      'dbWeeklyFirst'
    );

  var rows=
    Array.prototype.slice.call(
      document.querySelectorAll(
        '#dbWeeklyRows .db-weekly-row'
      )
    );

  if(!rows.length){
    status(
      'Carregue a competência primeiro.',
      'warn'
    );
    return;
  }

  var current=
    String(
      first&&first.value||
      'ALESSON'
    );

  rows.forEach(function(row){

    var select=
      row.querySelector(
        '.db-weekly-owner'
      );

    if(select){
      select.value=current;
    }

    current=
      current==='ALESSON'
        ? 'LEVY'
        : 'ALESSON';
  });

  status(
    'Alternância preenchida. Revise e salve.',
    'warn'
  );
}

function save(){
  var mes=
    document.getElementById(
      'dbMetaMes'
    );

  var rows=
    Array.prototype.slice.call(
      document.querySelectorAll(
        '#dbWeeklyRows .db-weekly-row'
      )
    );

  if(
    !mes ||
    !mes.value ||
    !rows.length
  ){
    status(
      'Carregue a competência primeiro.',
      'err'
    );
    return;
  }

  var semanas=
    rows.map(function(row){

      var select=
        row.querySelector(
          '.db-weekly-owner'
        );

      return {
        inicio:
          String(
            row.dataset.inicio||''
          ),

        fim:
          String(
            row.dataset.fim||''
          ),

        responsavel:
          String(
            select&&select.value||''
          )
      };
    });

  if(
    semanas.some(function(x){
      return !x.responsavel;
    })
  ){
    status(
      'Defina todas as semanas.',
      'err'
    );
    return;
  }

  var auth=
    authToken();

  if(!auth){
    status(
      'Sessão administrativa não encontrada.',
      'err'
    );
    return;
  }

  status(
    'Salvando...',
    ''
  );

  google.script.run
    .withSuccessHandler(function(){

      status(
        'Escala salva.',
        'ok'
      );

      loadWeekly();

    })
    .withFailureHandler(function(e){

      status(
        e&&e.message
          ? e.message
          : String(e),
        'err'
      );

    })
    .ATENDE_adminSalvarEscalaBalcao(
      auth,
      {
        competencia:mes.value,
        semanas:semanas
      }
    );
}

function addStyle(){
  if(
    document.getElementById(
      'db-weekly-css'
    )
  ){
    return;
  }

  var style=
    document.createElement(
      'style'
    );

  style.id=
    'db-weekly-css';

  style.textContent=
    '.db-weekly-card{'+
      'margin-top:12px;'+
      'border:1px solid var(--line);'+
      'border-radius:10px;'+
      'background:#fbfdff;'+
      'overflow:hidden'+
    '}'+

    '.db-weekly-card summary{'+
      'padding:10px 11px;'+
      'cursor:pointer;'+
      'font-size:11px;'+
      'font-weight:900;'+
      'color:var(--nv);'+
      'display:flex;'+
      'align-items:center;'+
      'gap:8px'+
    '}'+

    '.db-weekly-body{'+
      'padding:10px;'+
      'border-top:1px solid var(--line)'+
    '}'+

    '.db-weekly-note{'+
      'font-size:9px;'+
      'color:var(--muted);'+
      'line-height:1.4;'+
      'margin-bottom:9px'+
    '}'+

    '.db-weekly-tools{'+
      'display:flex;'+
      'gap:7px;'+
      'align-items:center;'+
      'margin-bottom:9px;'+
      'flex-wrap:wrap'+
    '}'+

    '.db-weekly-tools select,'+
    '.db-weekly-owner{'+
      'height:29px;'+
      'border:1px solid var(--line2);'+
      'border-radius:7px;'+
      'background:#fff;'+
      'padding:0 7px;'+
      'font:inherit;'+
      'font-size:9px'+
    '}'+

    '.db-weekly-rows{'+
      'display:grid;'+
      'gap:6px'+
    '}'+

    '.db-weekly-row{'+
      'display:grid;'+
      'grid-template-columns:1fr 180px;'+
      'gap:10px;'+
      'align-items:center;'+
      'padding:7px 8px;'+
      'border:1px solid #e8edf2;'+
      'border-radius:8px;'+
      'background:#fff'+
    '}'+

    '.db-weekly-period{'+
      'display:flex;'+
      'gap:10px;'+
      'align-items:center'+
    '}'+

    '.db-weekly-period strong{'+
      'font-size:9.5px;'+
      'color:var(--nv)'+
    '}'+

    '.db-weekly-period span{'+
      'font-size:9px;'+
      'color:var(--muted)'+
    '}'+

    '.db-weekly-actions{'+
      'margin-top:9px;'+
      'display:flex;'+
      'justify-content:flex-end'+
    '}'+

    '.db-weekly-empty{'+
      'text-align:center;'+
      'padding:14px;'+
      'font-size:9px;'+
      'color:var(--muted)'+
    '}';

  document.head.appendChild(
    style
  );
}

function mount(){
  var pane=
    document.getElementById(
      'pane-metas'
    );

  if(!pane){
    return false;
  }

  if(
    document.getElementById(
      'dbWeeklyCard'
    )
  ){
    return true;
  }

  addStyle();

  var details=
    document.createElement(
      'details'
    );

  details.id=
    'dbWeeklyCard';

  details.className=
    'db-weekly-card';

  details.innerHTML=
    '<summary>'+
      '<span class="material-symbols-rounded">'+
        'calendar_month'+
      '</span>'+
      '<span>'+
        'Responsável semanal do Balcão'+
      '</span>'+
      '<span class="status" id="dbWeeklyStatus"></span>'+
    '</summary>'+

    '<div class="db-weekly-body">'+

      '<div class="db-weekly-note">'+
        'A escala usa a mesma competência das Metas. '+
        'A alternância é apenas um preenchimento inicial e cada semana pode ser alterada manualmente.'+
      '</div>'+

      '<div class="db-weekly-tools">'+
        '<span>Iniciar com:</span>'+
        '<select id="dbWeeklyFirst">'+
          '<option value="ALESSON">Alesson</option>'+
          '<option value="LEVY">Levy</option>'+
        '</select>'+

        '<button class="btn" id="dbWeeklyGenerate" type="button">'+
          '<span class="material-symbols-rounded">'+
            'autorenew'+
          '</span>'+
          'Gerar alternância'+
        '</button>'+
      '</div>'+

      '<div class="db-weekly-rows" id="dbWeeklyRows">'+
        '<div class="db-weekly-empty">'+
          'Carregue uma competência.'+
        '</div>'+
      '</div>'+

      '<div class="db-weekly-actions">'+
        '<button class="btn btn-primary" id="dbWeeklySave" type="button">'+
          '<span class="material-symbols-rounded">'+
            'save'+
          '</span>'+
          'Salvar escala do mês'+
        '</button>'+
      '</div>'+

    '</div>';

  var revenue=
    pane.querySelector(
      '.db-revenue-card'
    );

  if(revenue){
    pane.insertBefore(
      details,
      revenue
    );
  }else{
    pane.appendChild(
      details
    );
  }

  document.getElementById(
    'dbWeeklyGenerate'
  ).addEventListener(
    'click',
    generate
  );

  document.getElementById(
    'dbWeeklySave'
  ).addEventListener(
    'click',
    save
  );

  var loadButton=
    document.getElementById(
      'dbMetaCarregar'
    );

  if(loadButton){
    loadButton.addEventListener(
      'click',
      function(){
        setTimeout(
          loadWeekly,
          100
        );
      }
    );
  }

  var month=
    document.getElementById(
      'dbMetaMes'
    );

  if(month){
    month.addEventListener(
      'change',
      function(){
        setTimeout(
          loadWeekly,
          50
        );
      }
    );
  }

  var tab=
    document.querySelector(
      '.admin-tab[data-tab="metas"]'
    );

  if(tab){
    tab.addEventListener(
      'click',
      function(){
        setTimeout(
          loadWeekly,
          150
        );
      }
    );
  }

  setTimeout(
    loadWeekly,
    150
  );

  return true;
}

var tries=0;

(function retry(){

  tries++;

  if(
    mount() ||
    tries>=40
  ){
    return;
  }

  setTimeout(
    retry,
    100
  );

})();

})();
</script>
